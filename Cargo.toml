[workspace]
resolver = "3"
members = [
    "projects/qapi-codegen",
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
    "projects/manager",
    "projects/qrab-init",
    "projects/qrab-guest-init",
    "projects/bmc",
    "projects/attest-server",
    "projects/qrab-boot-proto",
    "projects/qrab-boot-verify",
    "projects/qrab-snp-proto",
    "projects/qrab-attest-verifier",
    "projects/qrab-real-uki-demo-tests",
]
# qrab-boot targets `x86_64-unknown-uefi`, incompatible with the rest of the
# workspace. Build it separately from `projects/qrab-boot/`. See
# `~/workspace/llm-rag/reference/qrab-boot-plan.md`.
#
# `qrab-real-uki-demo` is a standalone `x86_64-unknown-uefi` PE used
# as a real UKI fixture for `contrib/matrix-smoke.sh` scenario 1r (see
# `reference/followups.md` F10). Built out-of-band by
# `contrib/build-test-uki.sh`.
exclude = [
    "projects/qrab-boot",
    "projects/qrab-real-uki-demo",
]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29" }
proc-macro2 = "1"
quote = "1"
which = "7"
paste = "1"
tempfile = "3"
futures = "0.3"
sha2 = { version = "0.10", default-features = false }
