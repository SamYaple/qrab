[workspace]
resolver = "3"
members = [
    "projects/qapi-codegen",
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
    "projects/manager",
    "projects/qrab-init",
    "projects/bmc",
    "projects/attest-server",
    "projects/qrab-boot-proto",
    "projects/qrab-boot-verify",
    "examples/simple-vm",
    "examples/preconfig-vm",
    "examples/events",
]
# qrab-boot targets `x86_64-unknown-uefi`, incompatible with the rest of the
# workspace. Build it separately from `projects/qrab-boot/`. See
# `~/workspace/llm-rag/reference/qrab-boot-plan.md`.
exclude = [
    "projects/qrab-boot",
]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29" }
proc-macro2 = "1"
quote = "1"
which = "7"
paste = "1"
tempfile = "3"
futures = "0.3"
