[workspace]
resolver = "3"
# The normal developer path is the generated protocol and pod runtime.
# Schema generation remains an explicit package selection.
default-members = [
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
    "projects/manager",
    "projects/oidc-bearer",
    "projects/bmc",
    "projects/redfish",
    "projects/operator",
    "projects/dashboard",
    "projects/iscsi-target",
    "projects/qrab-guest-agent",
    "projects/kvm-device-plugin",
    "projects/qrab-netd",
    "projects/qrab-spiffe",
]
members = [
    "projects/qapi-codegen",
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
    "projects/manager",
    "projects/oidc-bearer",
    "projects/bmc",
    "projects/redfish",
    "projects/operator",
    "projects/dashboard",
    "projects/iscsi-target",
    "projects/qrab-guest-agent",
    "projects/kvm-device-plugin",
    "projects/qrab-netd",
    "projects/qrab-spiffe",
]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29" }
proc-macro2 = "1"
quote = "1"
tempfile = "3"
futures = "0.3"
sha2 = { version = "0.10", default-features = false }
