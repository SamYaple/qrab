[workspace]
resolver = "3"
# The normal developer path is the generated protocol and pod runtime. Tooling,
# confidential-guest experiments remain explicit package selections.
default-members = [
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
    "projects/manager",
    "projects/bmc",
    "projects/operator",
    "projects/iscsi-target",
    "projects/qrab-guest-agent",
]
members = [
    "projects/qapi-codegen",
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
    "projects/manager",
    "projects/qrab-init",
    "projects/qrab-guest-init",
    "projects/bmc",
    "projects/operator",
    "projects/iscsi-target",
    "projects/qrab-guest-agent",
    "projects/attest-server",
    "projects/qrab-boot-proto",
    "projects/qrab-boot-verify",
    "projects/qrab-snp-proto",
    "projects/qrab-attest-verifier",
    "projects/qrab-real-uki-demo-tests",
]
# Standalone UEFI targets have their own toolchains. See docs/legacy.md.
exclude = [
    "projects/qrab-boot",
    "projects/qrab-real-uki-demo",
]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29" }
proc-macro2 = "1"
quote = "1"
which = "7"
paste = "1"
tempfile = "3"
futures = "0.3"
sha2 = { version = "0.10", default-features = false }
