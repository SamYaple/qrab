name: Feature request
description: Propose a new capability or a change to existing behavior.
labels: ["kind/feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first; the maintainers may suggest a different
        solution. Check ROADMAP.md and open issues for related work.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like qrab to behave, including any API, custom resource or Redfish changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other designs you thought about.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you work on this?
      options:
        - "Yes, I can open a pull request"
        - "I can help test or review"
        - "No"
