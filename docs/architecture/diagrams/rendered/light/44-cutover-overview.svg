<svg data-source-sha256="cc832666343d1c6e6af34cc9a10b39f0ef95599b0a26fb871a64e30d69fad7e3" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Move one workload, then retire its old owner</title><desc id="desc">Desired cross-cluster cutover: one data writer and one network authority at each step. An illustrative rehearsal, not a performed migration. Source backend, boot identity and data consistency must be inventoried.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#455b73"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#14253d" font-size="40" font-weight="700">Move one workload, then retire its old owner</text><text x="60" y="114" fill="#52657b" font-size="21">Desired cross-cluster cutover: one data writer and one network authority at each step.</text><polyline points="390,357 445,357" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="775,357 830,357" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1160,357 1215,357" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="240" width="330" height="235" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="76" y="265" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">1 / REHEARSE</text><text x="76" y="296" fill="#14253d" font-size="21">Copy data to isolated target</text><text x="76" y="324" fill="#14253d" font-size="21">Prove boot and policy</text><text x="76" y="352" fill="#14253d" font-size="21">Test application and recovery</text><text x="76" y="380" fill="#14253d" font-size="21">Source stays authoritative</text><rect x="445" y="240" width="330" height="235" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="461" y="265" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">2 / TRANSFER DATA</text><text x="461" y="296" fill="#14253d" font-size="21">Establish consistency point</text><text x="461" y="324" fill="#14253d" font-size="21">Stop the old writer</text><text x="461" y="352" fill="#14253d" font-size="21">Finish supported transfer</text><text x="461" y="380" fill="#14253d" font-size="21">Verify target content</text><rect x="830" y="240" width="330" height="235" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="846" y="265" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">3 / TRANSFER AUTHORITY</text><text x="846" y="296" fill="#14253d" font-size="21">Activate the target safely</text><text x="846" y="324" fill="#14253d" font-size="21">Move route / address / DNS</text><text x="846" y="352" fill="#14253d" font-size="21">Test the real user path</text><text x="846" y="380" fill="#14253d" font-size="21">Record accepted writes</text><rect x="1215" y="240" width="330" height="235" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="1231" y="265" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">4 / RETAIN THEN RETIRE</text><text x="1231" y="296" fill="#14253d" font-size="21">Source is now stale</text><text x="1231" y="324" fill="#14253d" font-size="21">Use explicit failback policy</text><text x="1231" y="352" fill="#14253d" font-size="21">Honor retained obligations</text><text x="1231" y="380" fill="#14253d" font-size="21">Destroy under its owner</text><rect x="230" y="600" width="1140" height="145" rx="10" fill="#fff6d8" stroke="#3b6494" stroke-width="1.5"/><text x="246" y="625" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">ROLLBACK CHANGES AT THE ACCEPTED-WRITE BOUNDARY</text><text x="246" y="656" fill="#14253d" font-size="21">Before target writes: rehearsed reversal. After target writes: data reconciliation and authority transfer.</text><text x="246" y="684" fill="#14253d" font-size="21">No OpenStack-to-qrab live migration or automatic cross-cluster address transfer is assumed.</text><text x="60" y="855" fill="#52657b" font-size="17">An illustrative rehearsal, not a performed migration. Source backend, boot identity and data consistency must be inventoried.</text></g></svg>
