<svg data-source-sha256="57be69ece37eaf35f5922068c5d07bbc2a3ac8f06c01e77f5eefff80e61c63c4" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Four different kinds of evidence</title><desc id="desc">A claim needs its scope, revision and the observation that supports it. Desired targets remain proposals. Local checks and source merges do not establish a deployed workload outcome.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#455b73"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#14253d" font-size="40" font-weight="700">Four different kinds of evidence</text><text x="60" y="114" fill="#52657b" font-size="21">A claim needs its scope, revision and the observation that supports it.</text><rect x="80" y="205" width="690" height="235" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="96" y="230" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SOURCE</text><text x="96" y="261" fill="#14253d" font-size="21">Who owns the operation?</text><text x="96" y="289" fill="#14253d" font-size="21">Code contracts / regression tests</text><text x="96" y="317" fill="#14253d" font-size="21">Baseline and repair revision identified</text><rect x="830" y="205" width="690" height="235" rx="10" fill="#fff6d8" stroke="#3b6494" stroke-width="1.5"/><text x="846" y="230" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">MANIFEST</text><text x="846" y="261" fill="#14253d" font-size="21">What configuration is requested?</text><text x="846" y="289" fill="#14253d" font-size="21">Checked-in resources / policy / image pins</text><text x="846" y="317" fill="#14253d" font-size="21">Applied cluster state still needs evidence</text><rect x="80" y="495" width="690" height="235" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="96" y="520" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">LOCAL REAL-PEER FIXTURE</text><text x="96" y="551" fill="#14253d" font-size="21">What mechanism actually ran here?</text><text x="96" y="579" fill="#14253d" font-size="21">Pinned QEMU / private sockets / netns</text><text x="96" y="607" fill="#14253d" font-size="21">Tooling, kernel and skip reasons recorded</text><rect x="830" y="495" width="690" height="235" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="846" y="520" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">NAMED LIVE OBSERVATION</text><text x="846" y="551" fill="#14253d" font-size="21">What happened on that release and path?</text><text x="846" y="579" fill="#14253d" font-size="21">Cluster / image / time / workload stated</text><text x="846" y="607" fill="#14253d" font-size="21">No automatic claim about the other cluster</text><text x="60" y="855" fill="#52657b" font-size="17">Desired targets remain proposals. Local checks and source merges do not establish a deployed workload outcome.</text></g></svg>
