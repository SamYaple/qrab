<svg data-source-sha256="5562c34dbcfa2b7e0375c7a8a1919ec7cbd9dafc7c52954d8b508c0b05b4be6b" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Current identity selects the held resource</title><desc id="desc">A Pod UID can outlive several containers and network namespaces. Unresolved container identity waits. A process restart in the same namespace preserves the attachment token.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#455b73"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#14253d" font-size="40" font-weight="700">Current identity selects the held resource</text><text x="60" y="114" fill="#52657b" font-size="21">A Pod UID can outlive several containers and network namespaces.</text><polyline points="1195,315 1195,395" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1195.0" y="346.0" text-anchor="middle" fill="#52657b" font-size="15">match</text><polyline points="1195,595 1195,635 800,635 800,685" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="997.5" y="626.0" text-anchor="middle" fill="#52657b" font-size="15">held references</text><rect x="80" y="185" width="1440" height="130" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="96" y="210" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">OBSERVED KUBERNETES SNAPSHOT</text><text x="96" y="246" fill="#14253d" font-size="21">Pod UID U + current running anchor container ID B</text><rect x="80" y="395" width="650" height="200" rx="10" fill="#fff0e9" stroke="#3b6494" stroke-width="1.5"/><text x="96" y="420" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">REFUSE THE STALE INCARNATION</text><text x="96" y="451" fill="#14253d" font-size="21">Same Pod UID U, older container A</text><text x="96" y="479" fill="#14253d" font-size="21">Still live in namespace A</text><text x="96" y="507" fill="#14253d" font-size="21">Existence alone is insufficient authority</text><rect x="870" y="395" width="650" height="200" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="886" y="420" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SELECT THE CURRENT INCARNATION</text><text x="886" y="451" fill="#14253d" font-size="21">Current container B</text><text x="886" y="479" fill="#14253d" font-size="21">Match trusted cgroup + held proc directory</text><text x="886" y="507" fill="#14253d" font-size="21">Open and verify namespace B</text><rect x="300" y="685" width="1000" height="95" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="316" y="710" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">USE THE VERIFIED RESOURCE</text><text x="316" y="746" fill="#14253d" font-size="21">Held process / namespace files → TAP and vhost queue descriptors</text><text x="60" y="855" fill="#52657b" font-size="17">Unresolved container identity waits. A process restart in the same namespace preserves the attachment token.</text></g></svg>
