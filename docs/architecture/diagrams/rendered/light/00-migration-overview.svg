<svg data-source-sha256="223b235a71171a2547881b82cdbd1869035129f7afee281f5cea7f72931baa4d" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Migration transfers ownership through separate streams</title><desc id="desc">The same VM moves between nodes. VM state, switch control and node conntrack have different owners. Arrows show logical payload direction. Disks remain shared; temporary forwarded guest packets are another distinct stream.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#455b73"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#14253d" font-size="40" font-weight="700">Migration transfers ownership through separate streams</text><text x="60" y="114" fill="#52657b" font-size="21">The same VM moves between nodes. VM state, switch control and node conntrack have different owners.</text><rect x="60" y="195" width="510" height="465" rx="12" fill="#f5f7fa" stroke="#9aaabd" stroke-width="2"/><text x="78" y="224" fill="#52657b" font-size="18" font-weight="600">SOURCE NODE</text><rect x="1030" y="195" width="510" height="465" rx="12" fill="#f5f7fa" stroke="#9aaabd" stroke-width="2"/><text x="1048" y="224" fill="#52657b" font-size="18" font-weight="600">TARGET NODE</text><polyline points="530,295 1070,295" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800.0" y="286.0" text-anchor="middle" fill="#52657b" font-size="15">1  VM state · exact same-VM mTLS</text><polyline points="530,355 1070,355" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800.0" y="346.0" text-anchor="middle" fill="#52657b" font-size="15">2  Switch control · separate connection</text><polyline points="530,550 1070,550" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800.0" y="541.0" text-anchor="middle" fill="#52657b" font-size="15">3  Conntrack · exact-node mTLS</text><rect x="100" y="260" width="430" height="130" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="116" y="285" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SAME VM IDENTITY</text><text x="116" y="316" fill="#14253d" font-size="21">Manager + local QEMU</text><text x="116" y="344" fill="#14253d" font-size="21">Current execution owner</text><rect x="1070" y="260" width="430" height="130" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="1086" y="285" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SAME VM IDENTITY</text><text x="1086" y="316" fill="#14253d" font-size="21">Manager + local QEMU</text><text x="1086" y="344" fill="#14253d" font-size="21">Prepared incoming owner</text><rect x="100" y="490" width="430" height="120" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="116" y="515" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">NODE IDENTITY</text><text x="116" y="546" fill="#14253d" font-size="21">Node netd</text><text x="116" y="574" fill="#14253d" font-size="21">Scoped VM / NIC state</text><rect x="1070" y="490" width="430" height="120" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="1086" y="515" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">NODE IDENTITY</text><text x="1086" y="546" fill="#14253d" font-size="21">Node netd</text><text x="1086" y="574" fill="#14253d" font-size="21">Scoped VM / NIC state</text><rect x="410" y="725" width="780" height="80" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="426" y="750" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SHARED STORAGE</text><text x="426" y="786" fill="#14253d" font-size="21">Guest disk blocks are not copied in the VM-state tunnel</text><text x="60" y="855" fill="#52657b" font-size="17">Arrows show logical payload direction. Disks remain shared; temporary forwarded guest packets are another distinct stream.</text></g></svg>
