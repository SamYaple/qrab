<svg data-source-sha256="61cbd65c5a8acd7584c0e0eaa9d4f5687b68940c768b75451e97570904350a03" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Budget whole device blocks before asking QEMU</title><desc id="desc">Example: boot 512 MiB / desired 514 MiB / applied guest capacity 513 MiB / device blocks 2 MiB Source/wire regression at c91da70. Reserved address space and guest onlining remain separate from the request budget.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#455b73"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#14253d" font-size="40" font-weight="700">Budget whole device blocks before asking QEMU</text><text x="60" y="114" fill="#52657b" font-size="21">Example: boot 512 MiB / desired 514 MiB / applied guest capacity 513 MiB / device blocks 2 MiB</text><polyline points="405,315 405,390" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1195,315 1195,390" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="190" width="1440" height="125" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="96" y="215" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">CHECKED LOGICAL BUDGET</text><text x="96" y="251" fill="#14253d" font-size="21">Only 1 MiB remains available for growth</text><rect x="80" y="390" width="650" height="230" rx="10" fill="#fff0e9" stroke="#3b6494" stroke-width="1.5"/><text x="96" y="415" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">BEFORE / ROUNDING AFTER THE CHECK</text><text x="96" y="446" fill="#14253d" font-size="21">Logical goal: 513 MiB</text><text x="96" y="474" fill="#14253d" font-size="21">Round 1 MiB up to one 2 MiB block</text><text x="96" y="502" fill="#14253d" font-size="21">QEMU request: 514 MiB / reported current: 513 MiB</text><text x="96" y="530" fill="#14253d" font-size="21">Request exceeds the checked capacity by 1 MiB</text><rect x="870" y="390" width="650" height="230" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="886" y="415" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">AFTER / CHECK THE ACTUAL WHOLE BLOCKS</text><text x="886" y="446" fill="#14253d" font-size="21">No whole block fits yet</text><text x="886" y="474" fill="#14253d" font-size="21">Keep the guest request at 512 MiB</text><text x="886" y="502" fill="#14253d" font-size="21">Wait for applied capacity of 514 MiB</text><text x="886" y="530" fill="#14253d" font-size="21">Then request exactly one 2 MiB block</text><rect x="80" y="700" width="1440" height="100" rx="10" fill="#fff6d8" stroke="#3b6494" stroke-width="1.5"/><text x="96" y="725" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">EXACT SIZES BETWEEN THE BLOCKS</text><text x="96" y="761" fill="#14253d" font-size="21">A desired 513 MiB from a 512 MiB boot uses controlled restart, which can apply that exact boot size.</text><text x="60" y="855" fill="#52657b" font-size="17">Source/wire regression at c91da70. Reserved address space and guest onlining remain separate from the request budget.</text></g></svg>
