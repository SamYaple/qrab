<svg data-source-sha256="7333a9e4794e3106df08bd92ee79e66835e17c150ba35effb58bb2babbcb4cba" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Separate VM roles, API rights and platform authority</title><desc id="desc">The same person or service can hold several grants. Each request still crosses its actual entrypoint. The dashboard backend is an API actor using its ServiceAccount. A service SVID does not become a universal human action grant.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#455b73"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#14253d" font-size="40" font-weight="700">Separate VM roles, API rights and platform authority</text><text x="60" y="114" fill="#52657b" font-size="21">The same person or service can hold several grants. Each request still crosses its actual entrypoint.</text><polyline points="490,245 620,245" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1050,245 1180,245" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="490,395 620,395" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1050,395 1180,395" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="490,545 620,545" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1050,545 1180,545" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="490,695 620,695" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1050,695 1180,695" fill="none" stroke="#455b73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="190" width="430" height="110" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="76" y="215" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">HUMAN VM USER</text><text x="76" y="251" fill="#14253d" font-size="21">Signed-in subject / VM role</text><rect x="620" y="190" width="430" height="110" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="636" y="215" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">ENTRYPOINT CHECK</text><text x="636" y="251" fill="#14253d" font-size="21">OIDC verification + action role</text><rect x="1180" y="190" width="360" height="110" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="1196" y="215" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SCOPE</text><text x="1196" y="251" fill="#14253d" font-size="21">Selected VM operation</text><rect x="60" y="340" width="430" height="110" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="76" y="365" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">API ACTOR / AUTOMATION</text><text x="76" y="401" fill="#14253d" font-size="21">Kubernetes credential</text><rect x="620" y="340" width="430" height="110" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="636" y="365" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">ENTRYPOINT CHECK</text><text x="636" y="401" fill="#14253d" font-size="21">API auth / RBAC / admission</text><rect x="1180" y="340" width="360" height="110" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="1196" y="365" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SCOPE</text><text x="1196" y="401" fill="#14253d" font-size="21">Declarative VM intent</text><rect x="60" y="490" width="430" height="110" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="76" y="515" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">CALLING WORKLOAD</text><text x="76" y="551" fill="#14253d" font-size="21">SPIFFE identity / rotating mTLS</text><rect x="620" y="490" width="430" height="110" rx="10" fill="#e8f0fb" stroke="#3b6494" stroke-width="1.5"/><text x="636" y="515" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">ENTRYPOINT CHECK</text><text x="636" y="551" fill="#14253d" font-size="21">Exact peer + endpoint policy</text><rect x="1180" y="490" width="360" height="110" rx="10" fill="#e9f4ef" stroke="#3b6494" stroke-width="1.5"/><text x="1196" y="515" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SCOPE</text><text x="1196" y="551" fill="#14253d" font-size="21">Scoped service call</text><rect x="60" y="640" width="430" height="110" rx="10" fill="#fff6d8" stroke="#3b6494" stroke-width="1.5"/><text x="76" y="665" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">PLATFORM ADMINISTRATOR</text><text x="76" y="701" fill="#14253d" font-size="21">Pod / node / storage / identity</text><rect x="620" y="640" width="430" height="110" rx="10" fill="#fff6d8" stroke="#3b6494" stroke-width="1.5"/><text x="636" y="665" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">CURRENT TRUST MODEL</text><text x="636" y="701" fill="#14253d" font-size="21">Substrate permissions</text><rect x="1180" y="640" width="360" height="110" rx="10" fill="#fff6d8" stroke="#3b6494" stroke-width="1.5"/><text x="1196" y="665" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SCOPE</text><text x="1196" y="701" fill="#14253d" font-size="21">Platform administration</text><text x="60" y="855" fill="#52657b" font-size="17">The dashboard backend is an API actor using its ServiceAccount. A service SVID does not become a universal human action grant.</text></g></svg>
