<svg data-source-sha256="f380805218229148dd18b0d008bef4da443cfc32ce5cd61ca7451e2f9127cbcd" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">OpenStack on Kubernetes</title><desc id="desc">Services are containerized. VM process ownership and guest networking remain separate. Supplied deployment model in the other cluster. Storage backend and detailed deployment configuration are not inferred.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#101b2b"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#bdcde0"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#f4f8fd" font-size="40" font-weight="700">OpenStack on Kubernetes</text><text x="60" y="114" fill="#b0c1d5" font-size="21">Services are containerized. VM process ownership and guest networking remain separate.</text><rect x="50" y="155" width="1500" height="650" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="68" y="184" fill="#b0c1d5" font-size="18" font-weight="600">OTHER CLUSTER  /  OPENSTACK</text><rect x="80" y="205" width="1440" height="185" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="98" y="234" fill="#b0c1d5" font-size="18" font-weight="600">Kubernetes Pods · cloud control services</text><rect x="80" y="445" width="910" height="175" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="98" y="474" fill="#b0c1d5" font-size="18" font-weight="600">Node · QEMU in libvirt-managed host cgroups</text><rect x="80" y="670" width="1440" height="110" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="98" y="699" fill="#b0c1d5" font-size="18" font-weight="600">Retained platform foundation</text><polyline points="505,355 505,415 310,415 310,505" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="407.5" y="406.0" text-anchor="middle" fill="#b0c1d5" font-size="15">libvirt controls QEMU</text><polyline points="785,355 785,505" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="495,545 600,545" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="547.5" y="536.0" text-anchor="middle" fill="#b0c1d5" font-size="15">packets</text><rect x="105" y="260" width="255" height="95" rx="10" fill="#573930" stroke="#8cb4df" stroke-width="1.5"/><text x="121" y="285" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">REPLACE</text><text x="121" y="321" fill="#f4f8fd" font-size="21">Nova / Placement</text><rect x="390" y="260" width="230" height="95" rx="10" fill="#573930" stroke="#8cb4df" stroke-width="1.5"/><text x="406" y="285" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">REPLACE</text><text x="406" y="321" fill="#f4f8fd" font-size="21">libvirt Pod</text><rect x="650" y="260" width="270" height="95" rx="10" fill="#573930" stroke="#8cb4df" stroke-width="1.5"/><text x="666" y="285" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">REPLACE</text><text x="666" y="321" fill="#f4f8fd" font-size="21">Neutron / OVN control</text><rect x="950" y="260" width="225" height="95" rx="10" fill="#573930" stroke="#8cb4df" stroke-width="1.5"/><text x="966" y="285" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">REPLACE</text><text x="966" y="321" fill="#f4f8fd" font-size="21">Keystone</text><rect x="1205" y="260" width="285" height="95" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="1221" y="285" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">FINISH REPLACEMENT</text><text x="1221" y="321" fill="#f4f8fd" font-size="21">Glance / Cinder</text><rect x="130" y="505" width="365" height="80" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="146" y="530" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">KEEP THE HYPERVISOR</text><text x="146" y="566" fill="#f4f8fd" font-size="21">QEMU / KVM VM</text><rect x="600" y="505" width="330" height="80" rx="10" fill="#573930" stroke="#8cb4df" stroke-width="1.5"/><text x="616" y="530" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">REPLACE GUEST FABRIC</text><text x="616" y="566" fill="#f4f8fd" font-size="21">OVN / OVS</text><rect x="1040" y="485" width="440" height="115" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="1056" y="510" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">KEEP THE CAPABILITY</text><text x="1056" y="541" fill="#f4f8fd" font-size="21">Backing storage</text><text x="1056" y="569" fill="#f4f8fd" font-size="21">Backend unspecified</text><rect x="100" y="715" width="440" height="48" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="116" y="746.0" fill="#f4f8fd" font-size="21">Kubernetes / kubelet / runtime</text><rect x="560" y="715" width="440" height="48" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="576" y="746.0" fill="#f4f8fd" font-size="21">Cilium · Kubernetes networking</text><rect x="1020" y="715" width="440" height="48" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="1036" y="746.0" fill="#f4f8fd" font-size="21">frr-k8s / FRR · BGP</text><text x="60" y="855" fill="#b0c1d5" font-size="17">Supplied deployment model in the other cluster. Storage backend and detailed deployment configuration are not inferred.</text></g></svg>
