<svg data-source-sha256="0a0a147c8be4c9e0e71e5d466e54bb152f231bb15fcd1178d657c876109cc217" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Choose the tenancy contract being offered</title><desc id="desc">Current source support, possible extensions and excluded trust models must remain distinct. Define the actor&#x27;s API, network, storage and recovery authority. A namespace or credential name alone does not establish it.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#101b2b"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#bdcde0"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#f4f8fd" font-size="40" font-weight="700">Choose the tenancy contract being offered</text><text x="60" y="114" fill="#b0c1d5" font-size="21">Current source support, possible extensions and excluded trust models must remain distinct.</text><rect x="60" y="245" width="450" height="410" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="76" y="270" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">CURRENT FOUNDATION</text><text x="76" y="301" fill="#f4f8fd" font-size="21">Protected platform namespace</text><text x="76" y="329" fill="#f4f8fd" font-size="21">Users call dashboard / VM services</text><text x="76" y="357" fill="#f4f8fd" font-size="21">Application roles select the VM</text><text x="76" y="385" fill="#f4f8fd" font-size="21">Backend uses its ServiceAccount</text><text x="76" y="413" fill="#f4f8fd" font-size="21">Pod / volume writers are trusted</text><rect x="575" y="245" width="450" height="410" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="591" y="270" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">POSSIBLE TENANT VM API</text><text x="591" y="301" fill="#f4f8fd" font-size="21">Constrain fields and references</text><text x="591" y="329" fill="#f4f8fd" font-size="21">Scope images / disks / NIC pools</text><text x="591" y="357" fill="#f4f8fd" font-size="21">Assign quota and visibility</text><text x="591" y="385" fill="#f4f8fd" font-size="21">Preserve user attribution</text><text x="591" y="413" fill="#f4f8fd" font-size="21">Prove isolation and recovery</text><rect x="1090" y="245" width="450" height="410" rx="10" fill="#573930" stroke="#8cb4df" stroke-width="1.5"/><text x="1106" y="270" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">OUTSIDE CURRENT CONTRACT</text><text x="1106" y="301" fill="#f4f8fd" font-size="21">Unrestricted hostile Pod writers</text><text x="1106" y="329" fill="#f4f8fd" font-size="21">Pod / exec / volume permissions</text><text x="1106" y="357" fill="#f4f8fd" font-size="21">Labels are public provenance</text><text x="1106" y="385" fill="#f4f8fd" font-size="21">Node / backend admins trusted</text><text x="1106" y="413" fill="#f4f8fd" font-size="21">No general hostile-tenant claim</text><text x="60" y="855" fill="#b0c1d5" font-size="17">Define the actor&#x27;s API, network, storage and recovery authority. A namespace or credential name alone does not establish it.</text></g></svg>
