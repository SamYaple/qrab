<svg data-source-sha256="a41f184d47901f222507d0383763a7733de99789b7c35af4c6470c624d001887" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">qrab: VMs owned by Kubernetes</title><desc id="desc">Keep the platform. Give VM execution, management and each guest NIC explicit boundaries. Target ownership built on current source. Privileged node/storage helpers remain separate; Glance/Cinder scope still needs work.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#101b2b"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#bdcde0"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#f4f8fd" font-size="40" font-weight="700">qrab: VMs owned by Kubernetes</text><text x="60" y="114" fill="#b0c1d5" font-size="21">Keep the platform. Give VM execution, management and each guest NIC explicit boundaries.</text><rect x="50" y="155" width="1500" height="650" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="68" y="184" fill="#b0c1d5" font-size="18" font-weight="600">QRAB CLUSTER  /  KUBERNETES-NATIVE VM CONTROL</text><rect x="90" y="365" width="860" height="255" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="108" y="394" fill="#b0c1d5" font-size="18" font-weight="600">VM Pod · management network identity · no API token</text><rect x="110" y="415" width="510" height="170" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="128" y="444" fill="#b0c1d5" font-size="18" font-weight="600">Manager container · its own cgroup</text><rect x="1030" y="365" width="460" height="255" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="1048" y="394" fill="#b0c1d5" font-size="18" font-weight="600">NIC anchor Pod · separate guest identity</text><rect x="90" y="680" width="1400" height="100" rx="12" fill="#16263a" stroke="#829ab5" stroke-width="2"/><text x="108" y="709" fill="#b0c1d5" font-size="18" font-weight="600">Retained platform foundation</text><polyline points="335,500 365,500" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="790,545 790,600 230,600 230,545" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="480,455 480,405 1000,405 1000,495 1060,495" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="210" width="480" height="100" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="106" y="235" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">DECLARATIVE INTENT</text><text x="106" y="271" fill="#f4f8fd" font-size="21">Kubernetes API + operator</text><rect x="610" y="210" width="390" height="100" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="626" y="235" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">HUMANS / WORKLOADS</text><text x="626" y="271" fill="#f4f8fd" font-size="21">OIDC + SPIRE</text><rect x="1040" y="210" width="440" height="100" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="1056" y="235" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">FOUNDATION + REMAINING WORK</text><text x="1056" y="271" fill="#f4f8fd" font-size="21">Images / volumes</text><rect x="130" y="455" width="205" height="90" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="146" y="480" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">SUPERVISOR</text><text x="146" y="516" fill="#f4f8fd" font-size="21">Rust manager</text><rect x="365" y="455" width="230" height="90" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="381" y="480" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">KEEP QEMU</text><text x="381" y="516" fill="#f4f8fd" font-size="21">QEMU + swtpm</text><rect x="660" y="455" width="260" height="90" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="676" y="480" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">USER MANAGEMENT</text><text x="676" y="516" fill="#f4f8fd" font-size="21">BMC / Redfish</text><rect x="1060" y="440" width="400" height="110" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="1076" y="465" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">CILIUM DATAPATH</text><text x="1076" y="496" fill="#f4f8fd" font-size="21">TAP / vhost / routing</text><text x="1076" y="524" fill="#f4f8fd" font-size="21">Own network namespace</text><rect x="110" y="720" width="420" height="45" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="126" y="749.5" fill="#f4f8fd" font-size="21">Cilium · endpoint policy</text><rect x="550" y="720" width="420" height="45" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="566" y="749.5" fill="#f4f8fd" font-size="21">frr-k8s / FRR · BGP</text><rect x="990" y="720" width="480" height="45" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="1006" y="749.5" fill="#f4f8fd" font-size="21">Linux / KVM / backing storage</text><text x="60" y="855" fill="#b0c1d5" font-size="17">Target ownership built on current source. Privileged node/storage helpers remain separate; Glance/Cinder scope still needs work.</text></g></svg>
