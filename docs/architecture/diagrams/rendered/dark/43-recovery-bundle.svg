<svg data-source-sha256="60bdbdaf814fa3de5a169855d5fb6977b569ceae836482b5237643316de8ebbb" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">A restore needs more than disk bytes</title><desc id="desc">Desired workload recovery contract: coordinate the set, then prove the restored application. Individual primitives exist. A complete backup/restore product, measured RTO/RPO and cross-platform identity transfer are not established.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#101b2b"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#bdcde0"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#f4f8fd" font-size="40" font-weight="700">A restore needs more than disk bytes</text><text x="60" y="114" fill="#b0c1d5" font-size="21">Desired workload recovery contract: coordinate the set, then prove the restored application.</text><rect x="60" y="205" width="450" height="240" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="76" y="230" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">APPLICATION DATA</text><text x="76" y="261" fill="#f4f8fd" font-size="21">Included root and data disks</text><text x="76" y="289" fill="#f4f8fd" font-size="21">Acknowledged-write point</text><text x="76" y="317" fill="#f4f8fd" font-size="21">Consistency method</text><text x="76" y="345" fill="#f4f8fd" font-size="21">Verified restored content</text><rect x="575" y="205" width="450" height="240" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="591" y="230" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">FIRMWARE / TPM IDENTITY</text><text x="591" y="261" fill="#f4f8fd" font-size="21">Preserve or replace intentionally</text><text x="591" y="289" fill="#f4f8fd" font-size="21">UEFI variables / TPM state</text><text x="591" y="317" fill="#f4f8fd" font-size="21">VM UID binding</text><text x="591" y="345" fill="#f4f8fd" font-size="21">Dependent enrollment decisions</text><rect x="1090" y="205" width="450" height="240" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="1106" y="230" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">DECLARATIVE VM INTENT</text><text x="1106" y="261" fill="#f4f8fd" font-size="21">Machine / CPU / device contract</text><text x="1106" y="289" fill="#f4f8fd" font-size="21">Boot and disk / NIC mapping</text><text x="1106" y="317" fill="#f4f8fd" font-size="21">Source and image provenance</text><text x="1106" y="345" fill="#f4f8fd" font-size="21">Supported target configuration</text><rect x="60" y="505" width="450" height="240" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="76" y="530" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">NETWORK AUTHORITY</text><text x="76" y="561" fill="#f4f8fd" font-size="21">Address / MAC / route / DNS</text><text x="76" y="589" fill="#f4f8fd" font-size="21">Endpoint security policy</text><text x="76" y="617" fill="#f4f8fd" font-size="21">Which copy may serve traffic</text><text x="76" y="645" fill="#f4f8fd" font-size="21">External reachability evidence</text><rect x="575" y="505" width="450" height="240" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="591" y="530" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">CREDENTIALS / REGISTRATIONS</text><text x="591" y="561" fill="#f4f8fd" font-size="21">Restore / rotate / re-issue</text><text x="591" y="589" fill="#f4f8fd" font-size="21">Human / service / guest / disk</text><text x="591" y="617" fill="#f4f8fd" font-size="21">Protect retained private material</text><text x="591" y="645" fill="#f4f8fd" font-size="21">Relying-service expiry behavior</text><rect x="1090" y="505" width="450" height="240" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="1106" y="530" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">OWNERSHIP AND ACCEPTANCE</text><text x="1106" y="561" fill="#f4f8fd" font-size="21">Exclude the old writer</text><text x="1106" y="589" fill="#f4f8fd" font-size="21">Record restored identity</text><text x="1106" y="617" fill="#f4f8fd" font-size="21">Test the actual application</text><text x="1106" y="645" fill="#f4f8fd" font-size="21">Own retention and destruction</text><text x="60" y="855" fill="#b0c1d5" font-size="17">Individual primitives exist. A complete backup/restore product, measured RTO/RPO and cross-platform identity transfer are not established.</text></g></svg>
