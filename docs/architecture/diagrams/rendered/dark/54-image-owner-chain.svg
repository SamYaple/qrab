<svg data-source-sha256="ff997aad230c8c20d27c3f2bba81d255726855b6e3cdac7a2c8dc0d8c7970185" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Image import: names are lookup keys</title><desc id="desc">The importer checks the current BaseImage, the exact Job and its report Pods before acting Implemented API safeguards. Storage fencing and sealing remain separate operations, with their own authority.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#101b2b"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#bdcde0"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#f4f8fd" font-size="40" font-weight="700">Image import: names are lookup keys</text><text x="60" y="114" fill="#b0c1d5" font-size="21">The importer checks the current BaseImage, the exact Job and its report Pods before acting</text><polyline points="500,315 580,315" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1020,315 1100,315" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="280,405 280,550" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="800,405 800,550" fill="none" stroke="#bdcde0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="225" width="440" height="180" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="76" y="250" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">PARENT / ACCEPTED INTENT</text><text x="76" y="281" fill="#f4f8fd" font-size="21">BaseImage UID + generation</text><text x="76" y="309" fill="#f4f8fd" font-size="21">Same spec and deletion state</text><text x="76" y="337" fill="#f4f8fd" font-size="21">Refresh current API version</text><rect x="580" y="225" width="440" height="180" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="596" y="250" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">JOB / OWNED EXECUTION</text><text x="596" y="281" fill="#f4f8fd" font-size="21">Exact BaseImage controller UID</text><text x="596" y="309" fill="#f4f8fd" font-size="21">Observe Job UID + version</text><text x="596" y="337" fill="#f4f8fd" font-size="21">A create conflict proves no owner</text><rect x="1100" y="225" width="440" height="180" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="1116" y="250" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">POD / REPORT ORIGIN</text><text x="1116" y="281" fill="#f4f8fd" font-size="21">Exact observed Job controller UID</text><text x="1116" y="309" fill="#f4f8fd" font-size="21">Select image-job termination</text><text x="1116" y="337" fill="#f4f8fd" font-size="21">Success requires exit code zero</text><rect x="60" y="550" width="440" height="180" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="76" y="575" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">STATUS / FINALIZERS</text><text x="76" y="606" fill="#f4f8fd" font-size="21">Patch current UID + version</text><text x="76" y="634" fill="#f4f8fd" font-size="21">Preserve other finalizers</text><text x="76" y="662" fill="#f4f8fd" font-size="21">Conflict leaves current state intact</text><rect x="580" y="550" width="440" height="180" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="596" y="575" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">STAGE CREDENTIAL / WRITE ONLY</text><text x="596" y="606" fill="#f4f8fd" font-size="21">No-op JSON tests prove owner</text><text x="596" y="634" fill="#f4f8fd" font-size="21">Receive metadata, never password</text><text x="596" y="662" fill="#f4f8fd" font-size="21">Delete checked UID + version</text><rect x="1100" y="550" width="440" height="180" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="1116" y="575" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">STORAGE / SEPARATE LIFETIME</text><text x="1116" y="606" fill="#f4f8fd" font-size="21">Stage, export, fence, hash, seal</text><text x="1116" y="634" fill="#f4f8fd" font-size="21">Backend generation is durable</text><text x="1116" y="662" fill="#f4f8fd" font-size="21">No API/storage transaction claim</text><text x="60" y="855" fill="#b0c1d5" font-size="17">Implemented API safeguards. Storage fencing and sealing remain separate operations, with their own authority.</text></g></svg>
