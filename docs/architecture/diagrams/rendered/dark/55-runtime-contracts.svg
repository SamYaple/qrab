<svg data-source-sha256="d72aaf89fffd27ebfbfa344d437b77ae629532ab5657c600688be6ffcc1b1acf" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Direct QEMU management has four contracts</title><desc id="desc">Typed commands, local supervision, declarative workflow and narrow external capabilities have different owners Current ownership map. Replacing libvirt/Nova requires the needed workload contract; this is not a feature-parity claim.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#101b2b"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#bdcde0"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#f4f8fd" font-size="40" font-weight="700">Direct QEMU management has four contracts</text><text x="60" y="114" fill="#b0c1d5" font-size="21">Typed commands, local supervision, declarative workflow and narrow external capabilities have different owners</text><rect x="80" y="230" width="650" height="210" rx="10" fill="#213c59" stroke="#8cb4df" stroke-width="1.5"/><text x="96" y="255" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">LOCAL EXECUTION / MANAGER</text><text x="96" y="286" fill="#f4f8fd" font-size="21">QEMU and swtpm child ownership</text><text x="96" y="314" fill="#f4f8fd" font-size="21">Identity lease, stop, wait and reap</text><text x="96" y="342" fill="#f4f8fd" font-size="21">Private sockets, power and local runtime status</text><rect x="870" y="230" width="650" height="210" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="886" y="255" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">PROTOCOL / GENERATED TYPES + QAPI-PROTOCOL</text><text x="886" y="286" fill="#f4f8fd" font-size="21">Typed commands and per-connection version</text><text x="886" y="314" fill="#f4f8fd" font-size="21">Bounded admission, replies, events and FDs</text><text x="886" y="342" fill="#f4f8fd" font-size="21">Independent of manager, Kubernetes and KVM</text><rect x="80" y="555" width="650" height="210" rx="10" fill="#254e46" stroke="#8cb4df" stroke-width="1.5"/><text x="96" y="580" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">DECLARATIVE WORKFLOW / KUBERNETES + OPERATOR</text><text x="96" y="611" fill="#f4f8fd" font-size="21">Admission, placement and container resources</text><text x="96" y="639" fill="#f4f8fd" font-size="21">Controlled launch, resize, migration and cleanup</text><text x="96" y="667" fill="#f4f8fd" font-size="21">Current intent and conditional API observations</text><rect x="870" y="555" width="650" height="210" rx="10" fill="#504522" stroke="#8cb4df" stroke-width="1.5"/><text x="886" y="580" fill="#b0c1d5" font-size="13" font-weight="700" letter-spacing="0.7">EXTERNAL CAPABILITY / SEPARATE PLATFORM OWNERS</text><text x="886" y="611" fill="#f4f8fd" font-size="21">netd grants kernel FDs; Cilium/FRR carries traffic</text><text x="886" y="639" fill="#f4f8fd" font-size="21">Storage owns bytes, exports and hard fences</text><text x="886" y="667" fill="#f4f8fd" font-size="21">OIDC roles and SPIFFE peers answer different questions</text><text x="60" y="855" fill="#b0c1d5" font-size="17">Current ownership map. Replacing libvirt/Nova requires the needed workload contract; this is not a feature-parity claim.</text></g></svg>
