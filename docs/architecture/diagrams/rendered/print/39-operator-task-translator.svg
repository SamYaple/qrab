<svg data-source-sha256="edcfb97e9d2aa035daa353efabb5d1924d7607e924f3499e829d50ffd3355c0d" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Translate the task, owner and outcome</title><desc id="desc">Familiar OpenStack work moves across narrower Kubernetes, runtime and platform owners. These are responsibility mappings. No OpenStack API compatibility or automatic workload acceptance is implied.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222222"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#111111" font-size="40" font-weight="700">Translate the task, owner and outcome</text><text x="60" y="114" fill="#52657b" font-size="21">Familiar OpenStack work moves across narrower Kubernetes, runtime and platform owners.</text><polyline points="510,285 575,285" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1025,285 1090,285" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="510,490 575,490" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1025,490 1090,490" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="510,695 575,695" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1025,695 1090,695" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="210" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="76" y="235" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">FAMILIAR TASK</text><text x="76" y="266" fill="#111111" font-size="21">Start a guest</text><text x="76" y="294" fill="#111111" font-size="21">Create / place / boot</text><rect x="575" y="210" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="591" y="235" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">TARGET OWNERS</text><text x="591" y="266" fill="#111111" font-size="21">Kubernetes → operator → manager</text><text x="591" y="294" fill="#111111" font-size="21">Intent / placement / local QEMU</text><rect x="1090" y="210" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1106" y="235" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">OBSERVE THE RESULT</text><text x="1106" y="266" fill="#111111" font-size="21">Current VM / Pod / QEMU state</text><text x="1106" y="294" fill="#111111" font-size="21">Then test the guest application</text><rect x="60" y="415" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="76" y="440" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">FAMILIAR TASK</text><text x="76" y="471" fill="#111111" font-size="21">Connect and protect a NIC</text><text x="76" y="499" fill="#111111" font-size="21">Address / policy / external route</text><rect x="575" y="415" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="591" y="440" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">TARGET OWNERS</text><text x="591" y="471" fill="#111111" font-size="21">Anchor / netd / Cilium / FRR</text><text x="591" y="499" fill="#111111" font-size="21">Attachment / identity / forwarding</text><rect x="1090" y="415" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1106" y="440" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">OBSERVE THE RESULT</text><text x="1106" y="471" fill="#111111" font-size="21">Exact endpoint / policy / route</text><text x="1106" y="499" fill="#111111" font-size="21">Then test the intended traffic</text><rect x="60" y="620" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="76" y="645" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">FAMILIAR TASK</text><text x="76" y="676" fill="#111111" font-size="21">Recover after node loss</text><text x="76" y="704" fill="#111111" font-size="21">Exclude the old disk writer</text><rect x="575" y="620" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="591" y="645" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">TARGET OWNERS</text><text x="591" y="676" fill="#111111" font-size="21">Storage guard + backend fence</text><text x="591" y="704" fill="#111111" font-size="21">Preserve unknown ownership</text><rect x="1090" y="620" width="450" height="150" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1106" y="645" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">OBSERVE THE RESULT</text><text x="1106" y="676" fill="#111111" font-size="21">Clean exit or hard fence evidence</text><text x="1106" y="704" fill="#111111" font-size="21">Then admit the replacement</text><text x="60" y="855" fill="#52657b" font-size="17">These are responsibility mappings. No OpenStack API compatibility or automatic workload acceptance is implied.</text></g></svg>
