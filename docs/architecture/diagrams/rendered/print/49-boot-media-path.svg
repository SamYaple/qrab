<svg data-source-sha256="a817c0122fe7b4bbaf7c582053f6ef2d5c68439789149d90a906d52c069397e9" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">A namesake cannot validate another boot image</title><desc id="desc">Conflicting-root configuration reproduced through the actual manager CLI check, using disposable files Configuration check only; no guest launched. Standard operator roots match. Trusted immutable media publication remains required.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222222"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#111111" font-size="40" font-weight="700">A namesake cannot validate another boot image</text><text x="60" y="114" fill="#52657b" font-size="21">Conflicting-root configuration reproduced through the actual manager CLI check, using disposable files</text><polyline points="405,460 405,570" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1195,460 1195,570" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="220" width="650" height="240" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="96" y="245" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">CHECKED UNDER QRAB_MEDIA_ROOT</text><text x="96" y="276" fill="#111111" font-size="21">/approved-media/installer.img</text><text x="96" y="304" fill="#111111" font-size="21">1 byte passes a 4-byte size cap</text><text x="96" y="332" fill="#111111" font-size="21">Old validation checked this namesake</text><rect x="870" y="220" width="650" height="240" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="886" y="245" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">CONFIGURED QEMU BOOT PATH</text><text x="886" y="276" fill="#111111" font-size="21">/var/lib/qrab-media/installer.img</text><text x="886" y="304" fill="#111111" font-size="21">34 bytes exceed that 4-byte size cap</text><text x="886" y="332" fill="#111111" font-size="21">Old configuration check still accepted it</text><rect x="80" y="570" width="1440" height="160" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="96" y="595" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">REPAIR / VALIDATE THE ACTUAL PATH</text><text x="96" y="626" fill="#111111" font-size="21">Resolve the configured QEMU boot path.</text><text x="96" y="654" fill="#111111" font-size="21">Require the same canonical image path that passed media policy validation.</text><text x="96" y="682" fill="#111111" font-size="21">Matching-root size and escape checks keep their established behavior.</text><text x="60" y="855" fill="#52657b" font-size="17">Configuration check only; no guest launched. Standard operator roots match. Trusted immutable media publication remains required.</text></g></svg>
