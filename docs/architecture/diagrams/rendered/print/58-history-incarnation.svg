<svg data-source-sha256="80ff1646ebc6660344cadea08f5e933f6060ddbacfc7e56ce75d1d1bd95ff47c" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">A reused name does not grant its old history</title><desc id="desc">Current API ownership authorizes a Pod UID; retained samples keep their original incarnation Actual templates tested with real PromQL over synthetic series. No production metrics or monitoring rollout was used.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222222"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#111111" font-size="40" font-weight="700">A reused name does not grant its old history</text><text x="60" y="114" fill="#52657b" font-size="21">Current API ownership authorizes a Pod UID; retained samples keep their original incarnation</text><polyline points="500,315 540,315 540,405 580,405" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="500,650 540,650 540,505 580,505" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1020,405 1060,405 1060,315 1100,315" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1020,505 1060,505 1060,650 1100,650" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="210" width="440" height="210" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="76" y="235" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">PREDECESSOR / RETAINED DATA</text><text x="76" y="266" fill="#111111" font-size="21">Namespace qrab / Pod vm-a</text><text x="76" y="294" fill="#111111" font-size="21">Pod UID P1 / earlier samples</text><text x="76" y="322" fill="#111111" font-size="21">Retained in Prometheus</text><rect x="60" y="545" width="440" height="210" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="76" y="570" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">CURRENT / VERIFIED OWNER</text><text x="76" y="601" fill="#111111" font-size="21">Same namespace and Pod name</text><text x="76" y="629" fill="#111111" font-size="21">Pod UID P2 / current samples</text><text x="76" y="657" fill="#111111" font-size="21">Current VM service admission</text><rect x="580" y="335" width="440" height="240" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="596" y="360" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">QUERY / CURRENT UID PREDICATE</text><text x="596" y="391" fill="#111111" font-size="21">Authenticate the VM service</text><text x="596" y="419" fill="#111111" font-size="21">Verify current API Pod UID</text><text x="596" y="447" fill="#111111" font-size="21">Native series: pod_uid = P2</text><text x="596" y="475" fill="#111111" font-size="21">cAdvisor: whole Pod UID in id</text><rect x="1100" y="210" width="440" height="210" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1116" y="235" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">EXCLUDE / P1 DOES NOT BECOME P2</text><text x="1116" y="266" fill="#111111" font-size="21">Predecessor samples excluded</text><text x="1116" y="294" fill="#111111" font-size="21">No name-only or legacy fallback</text><text x="1116" y="322" fill="#111111" font-size="21">Retention has a separate owner</text><rect x="1100" y="545" width="440" height="210" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1116" y="570" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">ALLOW / P2 SAMPLE HISTORY</text><text x="1116" y="601" fill="#111111" font-size="21">Return only current-UID history</text><text x="1116" y="629" fill="#111111" font-size="21">Fixed metrics, fields and bounds</text><text x="1116" y="657" fill="#111111" font-size="21">No general PromQL access</text><text x="60" y="855" fill="#52657b" font-size="17">Actual templates tested with real PromQL over synthetic series. No production metrics or monitoring rollout was used.</text></g></svg>
