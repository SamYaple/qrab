<svg data-source-sha256="318a39264284af8472e910e17df9315c67970067ca2614db4823ac695eebc210" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">A published target remains the current owner</title><desc id="desc">VM adoption and migration completion are separate conditional API writes Operator/private API proof. Runtime handover, Cilium traffic and storage fences retain their separate acceptance scope.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222222"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#111111" font-size="40" font-weight="700">A published target remains the current owner</text><text x="60" y="114" fill="#52657b" font-size="21">VM adoption and migration completion are separate conditional API writes</text><polyline points="500,335 580,335" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1020,335 1100,335" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="800,435 800,570" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1020,660 1100,660" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1320,570 1320,435" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="235" width="440" height="200" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="76" y="260" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">RUNTIME / HANDOVER EVIDENCE</text><text x="76" y="291" fill="#111111" font-size="21">Source reports migrated</text><text x="76" y="319" fill="#111111" font-size="21">Verify the recorded target UID</text><text x="76" y="347" fill="#111111" font-size="21">Check owned config and state</text><rect x="580" y="235" width="440" height="200" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="596" y="260" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">VM STATUS / ADOPTION RECEIPT</text><text x="596" y="291" fill="#111111" font-size="21">Current Pod name + UID + node</text><text x="596" y="319" fill="#111111" font-size="21">Current state claim + UID</text><text x="596" y="347" fill="#111111" font-size="21">Publish with object conditions</text><rect x="1100" y="235" width="440" height="200" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1116" y="260" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">MIGRATION STATUS / COMPLETION</text><text x="1116" y="291" fill="#111111" font-size="21">Record Succeeded separately</text><text x="1116" y="319" fill="#111111" font-size="21">Retire old source resources</text><text x="1116" y="347" fill="#111111" font-size="21">Keep the current execution</text><rect x="60" y="570" width="440" height="180" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="76" y="595" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">ALWAYS / CURRENT RESOURCES STAY</text><text x="76" y="626" fill="#111111" font-size="21">Pod, active anchors, state, config</text><text x="76" y="654" fill="#111111" font-size="21">Refusal retains known binding</text><text x="76" y="682" fill="#111111" font-size="21">Unknown ownership blocks effects</text><rect x="580" y="570" width="440" height="180" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="596" y="595" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">FAULT / COMPLETION WRITE LOST</text><text x="596" y="626" fill="#111111" font-size="21">VM status already names target</text><text x="596" y="654" fill="#111111" font-size="21">Migration record is still older</text><text x="596" y="682" fill="#111111" font-size="21">No rollback of adopted resources</text><rect x="1100" y="570" width="440" height="180" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1116" y="595" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">RETRY / FOLLOW THE RECEIPT</text><text x="1116" y="626" fill="#111111" font-size="21">Recognize exact current target</text><text x="1116" y="654" fill="#111111" font-size="21">Finish completion publication</text><text x="1116" y="682" fill="#111111" font-size="21">Then perform scoped cleanup</text><text x="60" y="855" fill="#52657b" font-size="17">Operator/private API proof. Runtime handover, Cilium traffic and storage fences retain their separate acceptance scope.</text></g></svg>
