t="95" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1136" y="540" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">DURABLE BYTES</text><text x="1136" y="576" fill="#111111" font-size="21">LIO / ZFS</text><rect x="120" y="720" width="1360" height="85" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="136" y="745" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">SEPARATE IDENTITY VOLUME</text><text x="136" y="781" fill="#111111" font-size="21">UEFI/vTPM state uses a small filesystem PVC, distinct from guest root/data LUNs</text><text x="60" y="855" fill="#52657b" font-size="17">CHAP authenticates access. Hard fencing, transport encryption and eventual data destruction are separate controls.</text></g></svg>
