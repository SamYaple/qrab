<svg data-source-sha256="7c31be0810c99f82087b3a62404773e7e0e382faadb8aa7c8e3f27dd057d4664" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Storage control and disk I/O are separate</title><desc id="desc">Provisioning reaches narrow storage authority. QEMU opens its own guest block-data connection. CHAP authenticates access. Hard fencing, transport encryption and eventual data destruction are separate controls.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222222"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#111111" font-size="40" font-weight="700">Storage control and disk I/O are separate</text><text x="60" y="114" fill="#52657b" font-size="21">Provisioning reaches narrow storage authority. QEMU opens its own guest block-data connection.</text><rect x="70" y="190" width="1460" height="195" rx="12" fill="#f4f4f4" stroke="#555555" stroke-width="2"/><text x="88" y="219" fill="#52657b" font-size="18" font-weight="600">PROVISIONING / AUTHORIZATION</text><rect x="70" y="455" width="1460" height="195" rx="12" fill="#f4f4f4" stroke="#555555" stroke-width="2"/><text x="88" y="484" fill="#52657b" font-size="18" font-weight="600">GUEST BLOCK I/O</text><polyline points="460,295 620,295" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><text x="540.0" y="286.0" text-anchor="middle" fill="#52657b" font-size="15">scoped API</text><polyline points="980,295 1120,295" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1050.0" y="286.0" text-anchor="middle" fill="#52657b" font-size="15">fixed verbs</text><polyline points="460,560 620,560" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><text 