<svg data-source-sha256="87342dc7712bf9b8da37e83332a3354afd6cbb7663460dfec327961ac6072b08" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Three command outcomes, three next steps</title><desc id="desc">A wire result is one observation in the larger VM lifecycle The transport does not replay mutations. Expired dispatched QMP sessions close; QGA reconnects must resynchronize.</desc><rect data-diagram-background="true" width="1600" height="900" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222222"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="60" y="71" fill="#111111" font-size="40" font-weight="700">Three command outcomes, three next steps</text><text x="60" y="114" fill="#52657b" font-size="21">A wire result is one observation in the larger VM lifecycle</text><polyline points="700,325 700,385 280,385 280,475" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="800,325 800,475" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="900,325 900,385 1320,385 1320,475" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="580" y="205" width="440" height="120" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="596" y="230" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">BOUNDED REQUEST / DISPATCH</text><text x="596" y="266" fill="#111111" font-size="21">Validate, admit and own the request</text><rect x="60" y="475" width="440" height="230" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="76" y="500" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">LOCAL REFUSAL BEFORE DISPATCH</text><text x="76" y="531" fill="#111111" font-size="21">This request was not sent</text><text x="76" y="559" fill="#111111" font-size="21">Correct the refused request</text><text x="76" y="587" fill="#111111" font-size="21">Then choose the next action</text><rect x="580" y="475" width="440" height="230" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="596" y="500" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">CORRELATED RESULT</text><text x="596" y="531" fill="#111111" font-size="21">Decode success or peer error</text><text x="596" y="559" fill="#111111" font-size="21">Assess the operation&#x27;s result</text><text x="596" y="587" fill="#111111" font-size="21">Observe the wider lifecycle</text><rect x="1100" y="475" width="440" height="230" rx="10" fill="#f5f5f5" stroke="#222222" stroke-width="1.5"/><text x="1116" y="500" fill="#52657b" font-size="13" font-weight="700" letter-spacing="0.7">DEADLINE / LOST REPLY AFTER DISPATCH</text><text x="1116" y="531" fill="#111111" font-size="21">Remote outcome may be unknown</text><text x="1116" y="559" fill="#111111" font-size="21">Re-observe state or fail closed</text><text x="1116" y="587" fill="#111111" font-size="21">Retry only if semantics permit</text><text x="60" y="855" fill="#52657b" font-size="17">The transport does not replay mutations. Expired dispatched QMP sessions close; QGA reconnects must resynchronize.</text></g></svg>
