[package]
name = "bmc"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dependencies.dioxus]
version = "0.7"
features = ["fullstack", "router"]

[dependencies.tokio]
version = "1"
features = ["time"]

[dependencies.manager]
path = "../manager"
optional = true

[dependencies.qapi]
path = "../qapi"
optional = true

[dependencies.qapi-protocol]
path = "../qapi-protocol"
optional = true

[dependencies.axum]
version = "0.8"
features = ["ws"]
optional = true

[dependencies.which]
version = "7"
optional = true

[dependencies.async-stream]
version = "0.3"
optional = true

[dependencies.tower-http]
version = "0.6"
features = ["fs"]
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = []
server = [
    "dioxus/server",
    "tokio/sync",
    "tokio/rt",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/process",
    "tokio/fs",
    "tokio/net",
    "tokio/io-util",
    "dep:manager",
    "dep:qapi",
    "dep:qapi-protocol",
    "dep:axum",
    "dep:async-stream",
    "dep:futures",
    "dep:tower-http",
    "dep:tracing-subscriber",
    "dep:which",
]
web = ["dioxus/web"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"
paste = "1"
which = "7"
manager = { path = "../manager" }
qapi = { path = "../qapi" }
qapi-protocol = { path = "../qapi-protocol" }
axum = { version = "0.8", features = ["ws"] }

[[test]]
name = "vnc_proxy"
required-features = ["server"]

[[test]]
name = "integration"
required-features = ["server"]

[[test]]
name = "concurrency"
required-features = ["server"]

[[test]]
name = "mock_bmc"
