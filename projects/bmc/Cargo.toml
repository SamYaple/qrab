[package]
name = "bmc"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "qrab-bmc"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "net", "time", "sync", "io-util"] }
manager = { path = "../manager" }
axum = { version = "0.8", features = ["ws"] }
futures = { workspace = true }
tower-http = { version = "0.6", features = ["fs"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
time = "0.3"

# Compatibility for native builds; the BMC no longer has a WASM build.
[features]
default = []
server = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = { workspace = true }
qapi-protocol = { path = "../qapi-protocol" }
qapi = { path = "../qapi" }
tokio-tungstenite = "0.29"
