[package]
name = "bmc"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dependencies.dioxus]
version = "0.7"
features = ["fullstack", "router"]

[dependencies.tokio]
version = "1"
features = ["sync"]
optional = true

[dependencies.manager]
path = "../manager"
optional = true

[dependencies.qapi]
path = "../qapi"
optional = true

[dependencies.qapi-protocol]
path = "../qapi-protocol"
optional = true

[dependencies.axum]
version = "0.7"
optional = true

[dependencies.async-stream]
version = "0.3"
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[features]
default = []
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:manager",
    "dep:qapi",
    "dep:qapi-protocol",
    "dep:axum",
    "dep:async-stream",
    "dep:futures",
]
web = ["dioxus/web"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
paste = "1"
which = "7"
manager = { path = "../manager" }
qapi = { path = "../qapi" }
qapi-protocol = { path = "../qapi-protocol" }

[[test]]
name = "integration"
required-features = ["server"]

[[test]]
name = "mock_bmc"
