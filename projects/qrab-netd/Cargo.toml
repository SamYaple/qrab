[package]
name = "qrab-netd"
version = "0.1.0"
edition = "2021"
description = "Per-node agent that builds each qrab NIC anchor's tap and hands tap and vhost-net fds to the owning VM's manager"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = "0.2"
nix = { workspace = true, features = ["socket", "uio", "sched", "fs"] }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "net", "time", "sync"] }
kube = { version = "5", features = ["runtime"] }
k8s-openapi = { version = "0.29", features = ["v1_37"] }

[dev-dependencies]
tempfile = { workspace = true }
