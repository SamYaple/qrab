[package]
name = "manager"
version = "0.2.0"
edition = "2021"

[features]
default = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
x509-cert = { version = "0.2", features = ["std"] }
tempfile = { workspace = true }
# Writes the cloud-init NoCloud seed volume; no clock, so timestamps are fixed.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }

# Places received tap and vhost-net fds at fixed numbers in QEMU.
command-fds = { version = "0.3", features = ["tokio"] }

[dependencies.qapi]
path = "../qapi"

[dependencies.qapi-protocol]
path = "../qapi-protocol"

# SPIFFE mTLS for the live migration tunnel.
[dependencies.qrab-spiffe]
path = "../qrab-spiffe"

# Tap datapath client: receives tap and vhost-net fds from qrab-netd.
[dependencies.qrab-netd]
path = "../qrab-netd"
default-features = false

# Wire types for the namespaced qrab guest-agent commands.
[dependencies.qrab-guest-agent]
path = "../qrab-guest-agent"

[dependencies.nix]
workspace = true
features = ["fs", "net", "process", "signal", "socket", "user"]

[dependencies.tokio]
workspace = true
features = ["rt", "macros", "process", "time", "signal", "sync", "net", "io-util"]

[dev-dependencies.tokio]
workspace = true
features = ["io-util"]

[dev-dependencies.qrab-spiffe]
path = "../qrab-spiffe"
features = ["fixture"]
