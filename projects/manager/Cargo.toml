[package]
name = "manager"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
which = "7"

[dependencies.qapi]
path = "../qapi"

[dependencies.qapi-protocol]
path = "../qapi-protocol"

[dependencies.nix]
version = "0.29"
features = ["fs", "process", "sched", "signal", "user"]

[dependencies.tokio]
version = "1"
features = ["net", "io-util", "sync", "rt", "macros", "rt-multi-thread", "process", "time", "fs"]

[dev-dependencies]
paste = "1"
serde_json = "1"

[dev-dependencies.serde]
version = "1"
features = ["derive"]
