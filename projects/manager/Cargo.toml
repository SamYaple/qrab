[package]
name = "manager"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# base64 is used to encode the SB Platform Key for QEMU's
# `-smbios type=11,value=<guid>:<base64>` OEM-string mechanism, which
# OVMF's EnrollDefaultKeys consumes to pin the runtime PK. Only added
# when the SVSM+SB lane is exercised; zero code-path cost when SB is off.
base64 = "0.22"

[dependencies.qapi]
path = "../qapi"

[dependencies.qapi-protocol]
path = "../qapi-protocol"

[dependencies.nix]
workspace = true
features = ["fs", "mount", "process", "sched", "signal", "user"]

[dependencies.tokio]
workspace = true
features = ["net", "io-util", "sync", "rt", "macros", "rt-multi-thread", "process", "time", "fs", "signal"]

[dev-dependencies]
paste = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
nix = { workspace = true, features = ["ioctl"] }
