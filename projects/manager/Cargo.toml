[package]
name = "manager"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[dependencies.qapi]
path = "../qapi"

[dependencies.qapi-protocol]
path = "../qapi-protocol"

[dependencies.nix]
workspace = true
features = ["fs", "mount", "process", "sched", "signal", "user"]

[dependencies.tokio]
workspace = true
features = ["net", "io-util", "sync", "rt", "macros", "rt-multi-thread", "process", "time", "fs"]

[dev-dependencies]
paste = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
nix = { workspace = true, features = ["ioctl"] }
