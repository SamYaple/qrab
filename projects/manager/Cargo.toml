[package]
name = "manager"
version = "0.2.0"
edition = "2021"

[features]
default = []
# Preserved host namespace/SEV/SVSM API, used by the older BMC server.
legacy-host = [
    "dep:base64",
    "dep:paste",
    "dep:tracing",
    "dep:which",
    "nix/ioctl",
    "nix/mount",
    "nix/sched",
    "nix/user",
    "tokio/fs",
    "tokio/rt-multi-thread",
]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
which = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
x509-cert = { version = "0.2", features = ["std"] }
tempfile = { workspace = true }
# Writes the cloud-init NoCloud seed volume; no clock, so timestamps are fixed.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
base64 = { version = "0.22", optional = true }
paste = { workspace = true, optional = true }

[dependencies.qapi]
path = "../qapi"

[dependencies.qapi-protocol]
path = "../qapi-protocol"

# SPIFFE mTLS for the live migration tunnel.
[dependencies.qrab-spiffe]
path = "../qrab-spiffe"

# Wire types for the namespaced qrab guest-agent commands.
[dependencies.qrab-guest-agent]
path = "../qrab-guest-agent"

[dependencies.nix]
workspace = true
features = ["fs", "net", "process", "signal", "socket", "user"]

[dependencies.tokio]
workspace = true
features = ["rt", "macros", "process", "time", "signal", "sync", "net", "io-util"]

[dev-dependencies.tokio]
workspace = true
features = ["io-util"]

[dev-dependencies.qrab-spiffe]
path = "../qrab-spiffe"
features = ["fixture"]

[[test]]
name = "child_crash_event"
required-features = ["legacy-host"]

[[test]]
name = "firmware"
required-features = ["legacy-host"]

[[test]]
name = "integration"
required-features = ["legacy-host"]

[[test]]
name = "sev"
required-features = ["legacy-host"]

[[test]]
name = "sev_kvm_readonly"
required-features = ["legacy-host"]

[[test]]
name = "sev_negative"
required-features = ["legacy-host"]

[[test]]
name = "vnc_display"
required-features = ["legacy-host"]
