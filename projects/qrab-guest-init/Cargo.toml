[package]
name = "qrab-guest-init"
version = "0.1.0"
edition = "2024"
description = "L5 PID-1 policy gate running inside the confidential guest — cross-checks every L1-L4 invariant before handing control to the workload service manager. See ~/workspace/llm-rag/docs/security/level-5-init.md."
publish = false

[lib]
name = "qrab_guest_init"
path = "src/lib.rs"

[[bin]]
name = "qrab-guest-init"
path = "src/main.rs"

# PID-1 in the UKI initramfs. Mounts /proc /sys /dev /run + efivarfs,
# stages Qrab{Report,Session,Secret} into /run/qrab, then execve's
# qrab-guest-init with QRAB_GUEST_INIT_LIVE=1. Spec: phase 5.3.c of
# docs/security/level-5-init.md.
[[bin]]
name = "qrab-init"
path = "src/bin/qrab-init.rs"

# Smoke-test stub that qrab-guest-init execve's after sealing the
# secret. Reads QRAB_SECRET_FD to EOF, emits `QRAB_NEXT_STAGE_OK
# len=<n>`, powers the VM off. Production replaces this with the
# workload service manager.
[[bin]]
name = "qrab-next-stage"
path = "src/bin/qrab-next-stage.rs"

[dependencies]
# Direct syscalls for reboot(2) / mount(2) / mountinfo parsing. Kept
# narrow; the L5 spec deliberately wants a thin dependency graph so
# the static musl build (Phase 2) is small and auditable.
#
# Features:
# - "reboot" — Phase 1 `halt()` and qrab-{init,next-stage} power-off.
# - "mount"  — qrab-init mounts /proc /sys /dev /run + efivarfs.
# - "fs"    — Phase 2c uses `nix::sys::memfd::memfd_create` and
#             `nix::fcntl::{FcntlArg::F_ADD_SEALS, SealFlag}` for the
#             sealed-memfd handoff in `secret::consume`. (In nix
#             0.29, `memfd` and `fcntl` are NOT separate features —
#             both live under `fs`.)
# - "process" — Phase 2c `execve` handoff from `main.rs`.
nix = { workspace = true, features = ["reboot", "mount", "fs", "process"] }
# SHA-256 for TCG event-log PCR replay (step 10 of the boot sequence)
# and Phase 2b secret-hash computation inside step 18's report_data
# reconstruct. Pinned to no-default-features + std feature: pure-Rust
# core, no asm backend, keeps the musl build portable. `qrab-snp-proto`
# already pulls the same dep via its `verify` feature.
sha2 = { workspace = true, features = ["std"] }
# Phase 2b step 18: reuse `qrab_boot_proto::PROTO_TAG` so the
# report_data reconstruct cannot silently drift from the bootloader
# side if the proto tag ever bumps. `std` enables the host-side
# `std::error::Error` impls (the musl build still works: `std` is
# available on musl).
qrab-boot-proto = { path = "../qrab-boot-proto", features = ["std"] }
# Phase 2b step 13: zerocopy-cast `/run/qrab/report`'s 1184 B body
# into an `SnpAttestationReport`. `std` + `alloc` pull in the host-
# side error surface (the musl build has both).
qrab-snp-proto = { path = "../qrab-snp-proto", features = ["std", "alloc"] }
# Phase 2b step 13: `FromBytes::ref_from_bytes` on the packed
# `SnpAttestationReport`. Same major version qrab-snp-proto pins so
# we share the transitive crate graph.
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }
