[package]
name = "attest-server"
version = "0.1.0"
edition = "2024"
description = "qrab-boot attestation server — AF_VSOCK stub speaking the qrab-boot-proto postcard dialect"
publish = false

[lib]
name = "attest_server"
path = "src/lib.rs"

[[bin]]
name = "attest-server"
path = "src/main.rs"

[dependencies]
qrab-boot-proto = { path = "../qrab-boot-proto", features = ["std"] }
vsock = "0.5"
anyhow = { workspace = true }
