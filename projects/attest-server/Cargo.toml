[package]
name = "attest-server"
version = "0.1.0"
edition = "2024"
description = "qrab-boot attestation server — AF_VSOCK stub speaking the qrab-boot-proto postcard dialect"
publish = false

[lib]
name = "attest_server"
path = "src/lib.rs"

[[bin]]
name = "attest-server"
path = "src/main.rs"

[dependencies]
qrab-boot-proto = { path = "../qrab-boot-proto", features = ["std"] }
# F2: server-side chain walker + SnpAttestationReport byte cast.
qrab-snp-proto = { path = "../qrab-snp-proto", features = ["std", "alloc", "verify"] }
qrab-attest-verifier = { path = "../qrab-attest-verifier" }
zerocopy = { version = "0.8", features = ["derive"] }
base64 = "0.22"
vsock = "0.5"
anyhow = { workspace = true }
# ECDSA-P256 signing of the attestation response. `pem` feature so an
# operator can point us at a stock `openssl ec` keypair.
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "std",
    "pem",
    "pkcs8",
] }
rand_core = { version = "0.6", default-features = false, features = [
    "std",
    "getrandom",
] }
# SHA-256 mirrors the digest used by `qrab-boot-proto::response_signing_digest`.
sha2 = { version = "0.10", default-features = false }
# B12-4: `pem_to_der_root_ca` parses each cert block of a multi-block
# PEM (e.g. AMD KDS `cert_chain` is `ASK ‖ ARK`) and picks the
# self-signed one. Only the DN-equality check needs x509; the
# transitive dep is already pulled by qrab-attest-verifier so
# declaring it here does not inflate the build graph.
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["alloc"] }

[dev-dependencies]
# Synthesise cert chains for `pem_to_der_root_ca` + end-to-end
# attestation tests: self-signed ARK + CA-issued "ASK" +
# attacker-controlled VCEK whose P-384 private key signs a
# constructed SnpAttestationReport. Matches qrab-attest-verifier's
# dev-dep set so build graph stays cached.
rcgen = { version = "0.14", default-features = false, features = [
    "crypto", "pem", "aws_lc_rs",
] }
# Drive the real ECDSA-P384 sign path in the end-to-end chain
# tests. `verify` feature of qrab-snp-proto pulls p384 already, so
# adding it here just exposes SigningKey without duplicating the
# transitive dep.
p384 = { version = "0.13", features = ["ecdsa"] }
