[package]
name = "attest-server"
version = "0.1.0"
edition = "2024"
description = "qrab-boot attestation server — AF_VSOCK stub speaking the qrab-boot-proto postcard dialect"
publish = false

[lib]
name = "attest_server"
path = "src/lib.rs"

[[bin]]
name = "attest-server"
path = "src/main.rs"

[dependencies]
qrab-boot-proto = { path = "../qrab-boot-proto", features = ["std"] }
# F2: server-side chain walker + SnpAttestationReport byte cast.
qrab-snp-proto = { path = "../qrab-snp-proto", features = ["std", "alloc"] }
qrab-attest-verifier = { path = "../qrab-attest-verifier" }
zerocopy = { version = "0.8", features = ["derive"] }
base64 = "0.22"
vsock = "0.5"
anyhow = { workspace = true }
# ECDSA-P256 signing of the attestation response. `pem` feature so an
# operator can point us at a stock `openssl ec` keypair.
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "std",
    "pem",
    "pkcs8",
] }
rand_core = { version = "0.6", default-features = false, features = [
    "std",
    "getrandom",
] }
# SHA-256 mirrors the digest used by `qrab-boot-proto::response_signing_digest`.
sha2 = { version = "0.10", default-features = false }
