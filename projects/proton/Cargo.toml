[package]
name = "qrab-proton"
version = "0.1.0"
edition = "2021"
description = "ProtonVPN for qrab VPN NICs: Proton API client, server catalog and selection, WireGuard keys and certificates"

[dependencies]
base64 = "0.22"
curve25519-dalek = "5"
proton-srp = "0.8.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = "2"
getrandom = "0.3"
zeroize = "1"

[dev-dependencies]
axum = "0.8"
qrab-netd = { path = "../qrab-netd", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
