[package]
name = "qapi-codegen"
version = "0.1.0"
edition = "2024"

[lib]
name = "qapi_codegen"
path = "src/lib.rs"

[[bin]]
name = "qapi-codegen"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
tar = "0.4"
heck = "0.5.0"
nom = "8.0.0"
prettyplease = "0.2.37"

[dependencies.syn]
version = "2.0.117"
features = ["full"]
