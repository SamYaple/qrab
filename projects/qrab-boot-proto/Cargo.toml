[package]
name = "qrab-boot-proto"
version = "0.1.0"
edition = "2024"
description = "Shared wire types for qrab-boot ↔ attestation-server (postcard over vsock)"
publish = false

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = []
# Enable `std::error::Error` impls when the consumer crate is a host
# binary (e.g. the attestation server). UEFI-side qrab-boot never
# enables this.
std = []
