[package]
name = "qrab-dashboard"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qrab-dashboard"
path = "src/main.rs"

[dependencies]
qrab-operator = { path = "../operator" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr = "=0.7.10"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
tokio-tungstenite = "0.29"
kube = { version = "5", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.29", features = ["v1_37", "schemars"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
time = "0.3"
base64 = "0.22"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
