[package]
name = "qrab-snp-proto"
version = "0.1.0"
edition = "2024"
description = "On-wire types + AES-256-GCM envelope for SEV-SNP SNP_GUEST_REQUEST (shared between qrab-boot and host-side verifier tests)"
publish = false

[dependencies]
# POD byte-layout derives for every `#[repr(C)]` SNP table. Pinned to
# match the qrab-boot workspace's zerocopy version so both sides use
# the same trait impls for the same struct definitions.
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
# AES-256-GCM for the `SNP_GUEST_REQUEST` envelope (AMD SEV-SNP ABI
# §5.4.2). Needs `aes` for the block cipher + `aead` for the Nonce /
# Tag type aliases. Explicitly turn OFF the default `alloc` feature
# so qrab-boot can use it in-place; we work in fixed 4 KiB buffers
# and never need heap allocations for the AEAD path.
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
# ECDSA-P384 + SHA-384 for `verify_report` (A05 — verifies the PSP
# signature over the 672-byte signed prefix of an
# `SnpAttestationReport`). Host-side only; pulls in std
# transitively via the `verify` feature so the no_std build used
# by qrab-boot never sees them.
p384 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }

[features]
default = []
# Enables `std::error::Error` impls + test helpers that need `std::`
# APIs. Unset on the UEFI side (qrab-boot keeps `no_std`), enabled
# transparently by `cargo test`.
std = ["alloc"]
# Enables the `cert_table` parser. Needs a `Vec` allocator; pulls in
# `extern crate alloc`. The UEFI side (qrab-boot) already runs with
# `extern crate alloc` because the `uefi` crate's global allocator
# is enabled, so turning this on there is free.
alloc = []
# Enables the `verify` module: ECDSA-P384 + SHA-384 signature check
# for `SnpAttestationReport`. Pulls in `p384` + `sha2` — both
# std-using on the RustCrypto defaults, so this feature is mutually
# exclusive with the UEFI build.
verify = ["dep:p384", "dep:sha2", "std"]
