[package]
name = "qrab-boot"
version = "0.1.0"
edition = "2024"
description = "Rust UEFI bootloader for SEV-SNP guests (replaces GRUB in AmdSev OVMF)"
publish = false

[[bin]]
name = "qrab-boot"
path = "src/main.rs"

[dependencies]
uefi = { version = "0.36", default-features = false, features = [
    "alloc",
    "global_allocator",
    "logger",
    "log-debugcon",
] }
# The `uefi` crate's `PciRootBridgeIo` wrapper stubs Map / Unmap /
# AllocateBuffer / FreeBuffer with a TODO (see
# uefi-0.36.1/src/proto/pci/root_bridge.rs). qrab-boot's virtio-vsock
# DMA needs those entry points to work under SEV-SNP, so we drop to
# the raw FFI bindings in `uefi-raw`, which declare the full
# PciRootBridgeIoProtocol layout.
uefi-raw = { version = "0.13", default-features = false }
log = { version = "0.4", default-features = false }
qrab-boot-verify = { path = "../qrab-boot-verify" }
qrab-boot-proto = { path = "../qrab-boot-proto" }
# SNP Guest-Request on-wire types (MsgReportReq / MsgReportResp /
# SnpAttestationReport / SnpGuestMsg / SnpSecretsPage). Defined in
# `projects/qrab-snp-proto` so host-side unit tests can exercise the
# layout assertions that `no_std` qrab-boot can only verify at
# compile-time.
qrab-snp-proto = { path = "../qrab-snp-proto", features = ["alloc"] }
# Phase 3 uses virtio-drivers for virtio-vsock transport instead of the
# UEFI NetworkPkg stack. The crate is no_std + alloc-only and does not
# force any edk2 DSC/FDF changes, which is the main reason for the
# pivot. `alloc` is the only feature we need at runtime.
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }
# ECDSA-P256 verification of the signed `AttestResponse` from
# `attest-server`. `ecdsa` pulls in sha2 transitively; we re-declare
# sha2 at the top level with matching features because the SNP
# `report_data` helper in qrab-boot-proto also builds a SHA-256.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
# zerocopy trait bounds appear in the `Transport::{read,write}_config_space`
# signatures that our `volatile_transport::VolatilePciTransport` wrapper
# has to re-declare. `virtio-drivers` already pulls zerocopy transitively
# via its default-enabled `alloc` feature; declaring it here pins the
# identical build so the trait impl compiles against the same version
# virtio-drivers picked up.
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# Emit line tables so `llvm-addr2line` / `llvm-symbolizer` can map
# ImageBase-relative RIPs from serial-log X64 exception dumps back to
# Rust source locations. `line-tables-only` adds only the `.debug_line`
# section (no full DWARF locals / types into `.debug_info`), which
# keeps qrab-boot.efi close to the stripped size — ~270 KiB vs a
# multi-MiB PE under full `debug = true` that would bloat the OVMF FV
# staging step. Keeps `strip = "symbols"` disabled so the line-table
# / PDB pairing survives.
debug = "line-tables-only"

[profile.dev]
panic = "abort"
