[package]
name = "qrab-observability"
version = "0.1.0"
edition = "2021"
description = "VM-bound SPIFFE telemetry bridge inside the Prometheus Pod"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
kube = { version = "5", features = ["client"] }
k8s-openapi = { version = "0.29", features = ["v1_37"] }
qrab-operator = { path = "../operator" }
qrab-redfish = { path = "../redfish" }
qrab-spiffe = { path = "../qrab-spiffe", features = ["http"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "net", "time", "sync", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"

[dev-dependencies]
qrab-spiffe = { path = "../qrab-spiffe", features = ["fixture"] }
serde_json = { workspace = true }
tower = { version = "0.5", features = ["util"] }
