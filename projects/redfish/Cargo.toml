[package]
name = "qrab-redfish"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qrab-redfish"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "net", "time", "sync"] }
manager = { path = "../manager" }
oidc-bearer = { path = "../oidc-bearer" }
qrab-spiffe = { path = "../qrab-spiffe", features = ["http"] }
axum = "0.8"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
uuid = "1"
base64 = "0.22"
argon2 = "0.5"
getrandom = "0.4"
sha2 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
qapi-protocol = { path = "../qapi-protocol" }
qrab-spiffe = { path = "../qrab-spiffe", features = ["fixture"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
