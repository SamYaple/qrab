[package]
name = "qrab-attest-verifier"
version = "0.1.0"
edition = "2024"
description = "Host-side SEV-SNP attestation chain verifier: ARK -> ASK -> VCEK + MSG_REPORT signature + measurement compare + AMD KDS fetch"
publish = false

[dependencies]
# Reuse the existing no_std-friendly parser + ECDSA-P384 report
# verifier. `verify` pulls in `p384` + `sha2` transitively; we also
# need `alloc` for `cert_table`.
qrab-snp-proto = { path = "../qrab-snp-proto", features = ["alloc", "std", "verify"] }
# AMD ARK / ASK certs use RSA-4096 (Milan/Genoa generations) with
# PKCS1-v1.5 or PSS signatures; the VCEK is ECDSA-P384 + SHA-384.
# Parse DER via `x509-cert`; verify RSA sigs via `rsa`; reuse the
# existing `p384` + `sha2` from qrab-snp-proto for the VCEK check.
x509-cert = { version = "0.2", features = ["std"] }
rsa = "0.9"
p384 = { version = "0.13", features = ["ecdsa"] }
# `oid` feature wires the `AssociatedOid` impls the `rsa::Pkcs1v15Sign::new`
# generic demands; without it the crate fails to compile with
# "the trait bound `sha2::OidSha256: AssociatedOid` is not satisfied".
sha2 = { version = "0.10", features = ["oid"] }
# SHA-1 is obsolete for new chains but Milan ARK certs still use
# `sha1WithRSAEncryption` (OID 1.2.840.113549.1.1.5) for the ARK
# self-signature on early Genoa chips, per AMD KDS dumps observed
# in the wild. Cheap to keep around; the PSS + PKCS1-v1.5 paths
# dominate.
sha1 = { version = "0.10", features = ["oid"] }
# AMD KDS HTTPS endpoints at https://kdsintf.amd.com/vcek/... —
# blocking `ureq` keeps the crate usable from simple CLI callers
# without pulling in tokio. attest-server's integration will wrap
# the blocking call in `tokio::task::spawn_blocking`.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
thiserror = { workspace = true }
# Width of AMD's cert DER oids we compare against: just bytes.
der = { version = "0.7", features = ["alloc"] }

[dev-dependencies]
# Synthetic cert generation for unit tests. `ring` does not expose
# RSA keygen, so we use `aws_lc_rs` which provides both RSA and
# ECDSA-P384 through the same rcgen backend. Keeps the dev-only
# cryptographic provider separate from production KDS fetches
# (which ride on `ureq`'s own rustls stack).
rcgen = { version = "0.14", default-features = false, features = [
    "crypto", "pem", "aws_lc_rs",
] }
hex = "0.4"
# Randomised PSS signing in the F3 hand-DER cert fixtures. `OsRng`
# lives behind the `getrandom` feature of `rand_core 0.6` (the
# version `rsa 0.9` pins transitively). Dev-only.
rand_core = { version = "0.6", features = ["getrandom"] }
# PSS signing key wants `RsaPrivateKey::from_pkcs8_der`, which
# lives under the `pkcs8` path `rsa` re-exports; no extra feature
# flip needed beyond what `rsa 0.9`'s defaults already give us.
