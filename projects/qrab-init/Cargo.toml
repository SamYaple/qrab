[package]
name = "qrab-init"
version = "0.1.0"
edition = "2021"
description = "Minimal init process for qrab namespace isolation"

[[bin]]
name = "qrab-init"
path = "src/main.rs"

[dependencies]
nix = { workspace = true, features = ["fs", "mount", "process", "signal", "user"] }
serde = { workspace = true }
serde_json = { workspace = true }
