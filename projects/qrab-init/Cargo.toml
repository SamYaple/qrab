[package]
name = "qrab-init"
version = "0.1.0"
edition = "2021"
description = "Minimal init process for qrab namespace isolation"

[[bin]]
name = "qrab-init"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = ["mount", "process", "signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
