[package]
name = "qapi-spec-parser"
version = "0.1.0"
edition = "2024"

[lib]
name = "qapi_spec_parser"
path = "src/lib.rs"

[[bin]]
name = "qapi-spec-parser"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
tempfile = "3"
heck = "0.5.0"
nom = "8.0.0"
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
quote = "1.0.45"
regex = "1.12.3"

[dependencies.syn]
version = "2.0.117"
features = ["full"]
