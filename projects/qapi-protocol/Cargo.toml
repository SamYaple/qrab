[package]
name = "qapi-protocol"
version = "0.2.0"
edition = "2021"

[dependencies]
getrandom = "0.4"
nix = { workspace = true, features = ["socket", "uio"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.qapi]
path = "../qapi"

[dependencies.tokio]
workspace = true
features = ["net", "io-util", "sync", "rt", "macros", "time"]

[dev-dependencies]
tempfile = { workspace = true }

[dev-dependencies.tokio]
workspace = true
features = ["net", "io-util", "sync", "rt", "macros", "rt-multi-thread", "process", "time", "test-util"]
