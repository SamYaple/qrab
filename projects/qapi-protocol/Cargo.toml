[package]
name = "qapi-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = "1"
serde_json = "1"

[dependencies.qapi]
path = "../qapi"

[dependencies.tokio]
version = "1"
features = ["net", "io-util", "sync", "rt", "macros"]

[dev-dependencies]
paste = "1"
which = "7"

[dev-dependencies.tokio]
version = "1"
features = ["net", "io-util", "sync", "rt", "macros", "rt-multi-thread", "process", "time", "fs"]
