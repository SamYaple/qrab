[package]
name = "qrab-tpm-issuer"
version = "0.1.0"
edition = "2021"
description = "EK and DevID certificates for a VM's vTPM, only for the vm/<uid> SVID that asks"

[[bin]]
name = "qrab-tpm-issuer"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
base64 = "0.22"
qrab-spiffe = { path = "../qrab-spiffe", features = ["http"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = "0.3"
tokio = { workspace = true, features = ["macros", "rt", "signal", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser = { version = "0.18", features = ["verify"] }

[dev-dependencies]
qrab-spiffe = { path = "../qrab-spiffe", features = ["fixture"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
