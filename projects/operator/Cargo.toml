[package]
name = "qrab-operator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "net", "io-util", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
kube = { version = "5", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.29", features = ["v1_37", "schemars"] }
schemars = "1"
url = "2"
uuid = "1"
axum = "0.8"
async-trait = "0.1"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
spiffe = { version = "=0.18.0", default-features = false, features = ["x509-source"] }
spiffe-rustls = { version = "=0.10.0", default-features = false, features = ["ring"] }
