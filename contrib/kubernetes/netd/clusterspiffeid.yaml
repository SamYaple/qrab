# Enroll via kubernetes-gitops before updating qrab-netd's image. Substitute
# the same reviewed immutable digest as daemonset.yaml; never grant the KVM
# plugin or VM/anchor containers this identity. The controller adds Pod UID.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: qrab-netd
spec:
  className: kubernetes-tpm
  spiffeIDTemplate: spiffe://yapplesauce.com/kubernetes/qrab-node/qrab-netd/{{ .PodSpec.NodeName }}
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: qrab-node
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qrab-netd
  workloadSelectorTemplates:
  - k8s:ns:qrab-node
  - k8s:sa:qrab-netd
  - k8s:container-name:netd
  - k8s:container-image:zot.yapplesauce.com/qrab/operator@sha256:OPERATOR_DIGEST
  - unix:uid:0
  ttl: 10m
  admin: false
