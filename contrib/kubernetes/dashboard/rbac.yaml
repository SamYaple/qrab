# The qrab-dashboard ServiceAccount itself lives in kubernetes-gitops
# (infrastructure/qrab-identity/identity.yaml), never pruned: node image-pull
# policies bind its UID. It disables token automount; the Deployment enables it.
# Namespace-scoped. VM patches are for power on/off only: the
# ValidatingAdmissionPolicy qrab-dashboard-vm-updates
# (contrib/kubernetes/operator/dashboard-update-policy.yaml) refuses any
# dashboard update that changes anything but spec.running. No update verb, no
# PVC deletion (PVCs hold TPM identities), no Secrets. The creator-subject
# annotation it sets is trusted by admission only for
# system:serviceaccount:qrab:qrab-dashboard.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qrab-dashboard
rules:
- apiGroups: [qrab.yapplesauce.com]
  resources: [virtualmachines]
  verbs: [get, list, create, delete, patch]
- apiGroups: ['']
  resources: [pods]
  verbs: [get]
- apiGroups: ['']
  resources: [persistentvolumeclaims]
  verbs: [get, create]
# The base-image catalog written by contrib/images/stage-base-image.sh.
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [qrab-base-images]
  verbs: [get]
# The list page reads all PodMetrics in one call.
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qrab-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qrab-dashboard
subjects:
- kind: ServiceAccount
  name: qrab-dashboard
  namespace: qrab
