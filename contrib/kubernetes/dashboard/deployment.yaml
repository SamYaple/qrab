apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrab-dashboard
  labels:
    app.kubernetes.io/name: qrab-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qrab-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qrab-dashboard
    spec:
      serviceAccountName: qrab-dashboard
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
      - ip: 192.168.0.251
        hostnames:
        - idm.yaple.net
      containers:
      - name: dashboard
        # Placeholder: pinned to the published immutable digest by the release pin commit.
        image: zot.yapplesauce.com/qrab/dashboard@sha256:3e05ed075b7785bf723177b5e3710baf42a44a116895ae483393ddd71dcd620c
        imagePullPolicy: Always
        env:
        - {name: DASHBOARD_PUBLIC_URL, value: 'https://vms.yapplesauce.com'}
        - {name: DASHBOARD_OIDC_ISSUER, value: 'https://idm.yaple.net/oauth2/openid/qrab-dashboard'}
        - {name: DASHBOARD_OIDC_CLIENT_ID, value: qrab-dashboard}
        - {name: DASHBOARD_OIDC_CLIENT_SECRET_FILE, value: /run/secrets/qrab-dashboard/oidc-client-secret}
        # qrab_vm_launchers
        - {name: DASHBOARD_LAUNCHER_GROUP, value: 7617e8d9-74ce-4525-a70b-80235206b06a}
        # qrab_vm_users, into which each VM's admins/viewers groups are nested
        - {name: DASHBOARD_VM_USERS_GROUP, value: 3d40e2a1-3968-43ea-b4a4-154cbd26d88b}
        # Image admins (stage/refresh/retire on /images): a name resolved at
        # startup; pin the group's UUID here once it is provisioned.
        - {name: DASHBOARD_IMAGE_ADMIN_GROUP, value: qrab_image_admins}
        - {name: DASHBOARD_KANIDM_URL, value: 'https://idm.yaple.net'}
        - {name: DASHBOARD_KANIDM_TOKEN_FILE, value: /run/secrets/qrab-dashboard/kanidm-token}
        - name: DASHBOARD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DASHBOARD_STORAGE_NODE
          value: kube03
        - name: DASHBOARD_LISTEN
          value: 127.0.0.1:8080
        - name: QRAB_SPIFFE_ENDPOINT_SOCKET
          value: unix:/run/spire/agent.sock
        - name: DASHBOARD_WORKLOAD_LISTEN
          value: 0.0.0.0:8445
        - name: DASHBOARD_WORKLOAD_PEERS
          value: spiffe://yapplesauce.com/kubernetes/kube-system/qrab-ingress
        ports:
        - name: dashboard-mtls
          containerPort: 8445
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: secrets
          mountPath: /run/secrets/qrab-dashboard
          readOnly: true
        - name: workload-socket
          mountPath: /run/spire
          readOnly: true
        startupProbe:
          periodSeconds: 2
          failureThreshold: 30
          exec:
            command:
            - /usr/local/bin/qrab-dashboard
            - probe-health
          timeoutSeconds: 3
        readinessProbe:
          periodSeconds: 5
          exec:
            command:
            - /usr/local/bin/qrab-dashboard
            - probe-health
          timeoutSeconds: 3
        livenessProbe:
          periodSeconds: 10
          exec:
            command:
            - /usr/local/bin/qrab-dashboard
            - probe-health
          timeoutSeconds: 3
      volumes:
      - name: workload-socket
        csi:
          driver: csi.spiffe.io
          readOnly: true
      - name: secrets
        secret:
          secretName: qrab-dashboard
          defaultMode: 288
          items:
          - key: oidc-client-secret
            path: oidc-client-secret
          - key: kanidm-token
            path: kanidm-token
