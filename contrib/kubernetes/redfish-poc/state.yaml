# Fresh POC claims; retained earlier VM claims are intentionally untouched.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qrab-redfish-poc-state
spec:
  storageClassName: zfs-block
  accessModes: [ReadWriteOncePod]
  volumeMode: Filesystem
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qrab-redfish-poc-redfish-state
spec:
  storageClassName: zfs-block
  accessModes: [ReadWriteOncePod]
  volumeMode: Filesystem
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: qrab-redfish-poc-media}
spec:
  storageClassName: zfs-block
  accessModes: [ReadWriteOncePod]
  volumeMode: Filesystem
  resources: {requests: {storage: 1Gi}}
