# SAMPLE ONLY (contrib/kubernetes/README.md). The qrab-demo VM was retired.
# Copy and rename every name, selector, host and Kanidm callback, then render the
# immutable VM UID with render-console.sh; never apply a stale identity binding.
# This directory deliberately has no kustomization.
apiVersion: v1
kind: Service
metadata:
  name: qrab-demo
spec:
  selector:
    app.kubernetes.io/name: qrab
    app.kubernetes.io/component: vm
    app.kubernetes.io/instance: qrab-demo
    qrab.yapplesauce.com/owner-uid: QRAB_VM_UID
  ports:
  - name: bmc-mtls
    port: 8443
    targetPort: bmc-mtls
    appProtocol: https
  - name: redfish-mtls
    port: 8444
    targetPort: redfish-mtls
    appProtocol: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qrab-demo
  annotations:
    ingress.cilium.io/force-https: enabled
    ingress.cilium.io/spiffe-backends: '{"qrab-demo:bmc-mtls":"spiffe://yapplesauce.com/kubernetes/qrab/vm/QRAB_VM_UID/bmc","qrab-demo:redfish-mtls":"spiffe://yapplesauce.com/kubernetes/qrab/vm/QRAB_VM_UID/redfish"}'
spec:
  ingressClassName: cilium
  tls:
  - hosts:
    - qrab-demo.yapplesauce.com
    secretName: qrab-demo-tls
  rules:
  - host: qrab-demo.yapplesauce.com
    http:
      paths:
      - path: /redfish
        pathType: Prefix
        backend:
          service:
            name: qrab-demo
            port:
              name: redfish-mtls
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qrab-demo
            port:
              name: bmc-mtls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qrab-demo-tls
spec:
  secretName: qrab-demo-tls
  dnsNames:
  - qrab-demo.yapplesauce.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qrab-demo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qrab
      app.kubernetes.io/component: vm
      app.kubernetes.io/instance: qrab-demo
      qrab.yapplesauce.com/owner-uid: QRAB_VM_UID
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8443'
        protocol: TCP
      - port: '8444'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
  - toCIDR:
    - 192.168.0.251/32
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
  - toCIDR:
    - 10.203.0.1/32
    toPorts:
    - ports:
      - port: '3260'
        protocol: TCP
