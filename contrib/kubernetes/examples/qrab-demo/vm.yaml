# SAMPLE ONLY (contrib/kubernetes/README.md). The qrab-demo VM was retired.
# Copy and rename every name, selector,
# claim and host before applying (never reuse the retained qrab-demo-state
# claim); this directory deliberately has no kustomization.
# Identity storage is deliberately outside operator ownership. Do not delete or
# replace this claim during a VM restart or CR deletion; that would lose its TPM.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qrab-demo-state
spec:
  storageClassName: zfs-block
  accessModes: [ReadWriteOncePod]
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: qrab.yapplesauce.com/v1alpha1
kind: VirtualMachine
metadata:
  name: qrab-demo
spec:
  stateVolumeClaim: qrab-demo-state
  memoryMiB: 512
  cpus: 1
  running: true
  bootDisk: /opt/qrab/demo/boot.img
  console:
    publicUrl: https://qrab-demo.yapplesauce.com
    allowedSubjects:
    - 6175a2a1-efb9-44e8-8c0b-5fe7ace18f9b
  components:
    redfish:
      enabled: true
      adminSubjects:
      - 6175a2a1-efb9-44e8-8c0b-5fe7ace18f9b
