# The importer reconciles BaseImages, runs its inspect/write Jobs and reads
# their Pods' termination messages. Stage credentials are write-only (no
# Secret get/list/watch); secret-policy.yaml confines those writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qrab-image-importer
rules:
- apiGroups: [qrab.yapplesauce.com]
  resources: [baseimages]
  verbs: [get, list, watch, patch]
- apiGroups: [qrab.yapplesauce.com]
  resources: [baseimages/status]
  verbs: [get, patch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create, delete]
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list]
- apiGroups: ['']
  resources: [secrets]
  verbs: [create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qrab-image-importer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qrab-image-importer
subjects:
- kind: ServiceAccount
  name: qrab-image-importer
  namespace: qrab
