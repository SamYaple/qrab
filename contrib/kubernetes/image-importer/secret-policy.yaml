# Confines the importer's Secret writes to the stage credentials it renders:
# <bimg>-stage, controller-owned by that BaseImage, labelled
# image-stage-credential with the owner's UID, holding only `password`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: qrab-image-importer-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE, DELETE]
      resources: [secrets]
  matchConditions:
  - name: qrab-image-importer
    expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':qrab-image-importer'"
  variables:
  - name: subject
    expression: "request.operation == 'DELETE' ? oldObject : object"
  - name: owners
    expression: "has(variables.subject.metadata.ownerReferences) ? variables.subject.metadata.ownerReferences : []"
  - name: labels
    expression: "has(variables.subject.metadata.labels) ? variables.subject.metadata.labels : {}"
  validations:
  - expression: >-
      variables.owners.size() == 1 &&
      variables.owners[0].apiVersion == 'qrab.yapplesauce.com/v1alpha1' &&
      variables.owners[0].kind == 'BaseImage' &&
      has(variables.owners[0].controller) && variables.owners[0].controller == true &&
      variables.subject.metadata.name == variables.owners[0].name + '-stage'
    message: the image importer may only write <bimg>-stage Secrets controller-owned by that BaseImage
  - expression: >-
      'app.kubernetes.io/component' in variables.labels &&
      variables.labels['app.kubernetes.io/component'] == 'image-stage-credential' &&
      'qrab.yapplesauce.com/owner-uid' in variables.labels &&
      variables.owners.size() == 1 &&
      variables.labels['qrab.yapplesauce.com/owner-uid'] == variables.owners[0].uid
    message: the image importer may only write its labelled image-stage-credential Secrets
  - expression: >-
      request.operation == 'DELETE' ||
      (has(object.type) && object.type == 'Opaque' && has(object.data) &&
       object.data.size() == 1 && 'password' in object.data)
    message: stage credentials hold only an Opaque password key
  - expression: >-
      request.operation != 'UPDATE' ||
      (has(oldObject.metadata.ownerReferences) && oldObject.metadata.ownerReferences.size() == 1 &&
       variables.owners.size() == 1 &&
       oldObject.metadata.ownerReferences[0].uid == variables.owners[0].uid)
    message: the image importer may only update a stage credential it already owns for the same BaseImage
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: qrab-image-importer-secrets
spec:
  policyName: qrab-image-importer-secrets
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: qrab
