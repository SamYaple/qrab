# The broker talks to the Kubernetes API and to Proton's API, nothing else,
# and accepts no connections.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qrab-proton-broker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qrab-proton-broker
  ingress: []
  egress:
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - {port: "53", protocol: UDP}
      - {port: "53", protocol: TCP}
      rules:
        dns:
        - matchName: vpn-api.proton.me
  - toFQDNs:
    - matchName: vpn-api.proton.me
    toPorts:
    - ports:
      - {port: "443", protocol: TCP}
