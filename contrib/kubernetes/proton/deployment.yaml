# The ProtonVPN broker: one replica, the only holder of the Proton session
# (two refreshing holders would get it revoked, hence Recreate).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrab-proton-broker
  labels:
    app.kubernetes.io/name: qrab-proton-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qrab-proton-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qrab-proton-broker
    spec:
      serviceAccountName: qrab-proton-broker
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Every node is a control-plane node.
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: broker
        # The operator image carries qrab-proton; pinned with the operator, whose
        # digest zot retains (kubernetes-gitops infrastructure/zot/retained-tags.txt).
        image: zot.yapplesauce.com/qrab/operator@sha256:f3d7d09dd3403bd9c11ec8f35173d19ec698a32df04d43d57be5881eb160eeea
        # Zot images must be pulled Always (cluster policy zot-delegated-pulls).
        imagePullPolicy: Always
        command: [/usr/local/bin/qrab-proton, broker]
        env:
        - name: QRAB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          # Proton's catalog (~19k servers) is parsed in full every 6 h.
          limits: {cpu: '1', memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
