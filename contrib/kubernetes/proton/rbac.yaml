# The ProtonVPN broker (docs/networking.md, "ProtonVPN"). It reads only the
# two Secrets it owns by name; it writes profile Secrets blind (server-side
# apply), and policy.yaml confines every write to vpn-<profile> Secrets owned
# by that VpnProfile, proton-keys, proton-session and ConfigMap proton-catalog.
# Its ServiceAccount, with its image-pull identity, lives in kubernetes-gitops
# (infrastructure/qrab-identity), like the operator's and the dashboard's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qrab-proton-broker
rules:
- apiGroups: [qrab.yapplesauce.com]
  resources: [vpnprofiles]
  verbs: [get, list, watch]
- apiGroups: [qrab.yapplesauce.com]
  resources: [vpnprofiles/status]
  verbs: [patch]
# Which NIC anchors mount a profile's Secret, and the port qrab-netd mapped.
- apiGroups: ['']
  resources: [pods]
  verbs: [list]
- apiGroups: ['']
  resources: [secrets]
  resourceNames: [proton-session, proton-keys]
  verbs: [get, update]
# Creating proton-keys and applying vpn-<profile> Secrets: names are not
# known in advance, so policy.yaml checks each write.
- apiGroups: ['']
  resources: [secrets]
  verbs: [create, patch]
- apiGroups: ['']
  resources: [configmaps]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qrab-proton-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qrab-proton-broker
subjects:
- kind: ServiceAccount
  name: qrab-proton-broker
