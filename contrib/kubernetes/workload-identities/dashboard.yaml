# Image-bound dashboard workload identity. This is separate from registry pull
# enrollment and OIDC user identities. Update the image pin with the Deployment
# and stage through kubernetes-gitops, not the dashboard's own kustomization.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: qrab-dashboard
spec:
  className: kubernetes-tpm
  spiffeIDTemplate: spiffe://yapplesauce.com/kubernetes/qrab/qrab-dashboard
  namespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: qrab}
  podSelector:
    matchLabels: {app.kubernetes.io/name: qrab-dashboard}
  workloadSelectorTemplates:
  - k8s:ns:qrab
  - k8s:sa:qrab-dashboard
  - k8s:container-name:dashboard
  - k8s:container-image:zot.yapplesauce.com/qrab/dashboard@sha256:b664685495e5caba53352ad7fbd78fda73d8da6bfa545a2d6aafe676f20a6ac0
  - unix:uid:10001
  ttl: 10m
  admin: false
  downstream: false
