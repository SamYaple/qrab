# The operator with its storage-service client. Apply only after
# kubernetes-gitops has reconciled ClusterSPIFFEID qrab-operator (pinned to the
# same operator digest as ../operator/deployment.yaml) and
# ConfigMap qrab/qrab-storage-host-ca, and the host daemon/shim are active:
#   kubectl apply -k contrib/kubernetes/operator-storage-api
# (client-side, like ../operator: --server-side conflicts with the
# kubectl-client-side-apply field manager that owns the Deployment)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qrab
resources:
- ../operator
components:
- ../operator/storage-api
