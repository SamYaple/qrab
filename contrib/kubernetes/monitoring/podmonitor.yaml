# Prometheus talks only to a Pod-local adapter at 127.0.0.1:19993. The adapter
# verifies current VM/Pod/IP ownership and uses exact-VM SPIFFE mTLS to 9181.
# This HTTP scheme describes the local scrape leg, not the VM network hop.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: qrab-vm-redfish
  namespace: qrab
  labels:
    app.kubernetes.io/name: qrab
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: qrab
      app.kubernetes.io/component: vm
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    scheme: http
    interval: 30s
    scrapeTimeout: 10s
    relabelings:
    # The VM name, stable across Pod replacement and live migration.
    - action: replace
      sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
      targetLabel: vm
    - action: replace
      sourceLabels: [__address__]
      targetLabel: instance
    - action: replace
      sourceLabels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_qrab_yapplesauce_com_owner_uid, __meta_kubernetes_pod_ip]
      separator: /
      targetLabel: __param_target
    - action: replace
      targetLabel: __address__
      replacement: 127.0.0.1:19993
