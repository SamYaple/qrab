# IP handoff for live migration (forks/cilium P1, work/cilium-handoff-ipam).
# A pod annotated ipam.cilium.io/handoff-from: <namespace>/<pod> gets that
# running pod's IP from the agent as a fenced standby endpoint, without IPAM.
# The agent itself requires a source on another node with one IPv4 and the
# identical identity label set, and the IP inside the target's own pool. This
# policy adds who may ask: only the qrab operator, only at creation, only for a
# qrab NIC anchor whose pool is a qrab-nic-<address> inside the NIC range
# (keep the range equal to QRAB_NIC_ADDRESS_RANGE in deployment.yaml).
# Checked live by contrib/kubernetes/operator/check-nic-handoff-policy.sh.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: qrab-nic-handoff
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  matchConditions:
  - name: handoff-annotated
    expression: >-
      'ipam.cilium.io/handoff-from' in object.metadata.?annotations.orValue({}) ||
      (request.operation == 'UPDATE' &&
       'ipam.cilium.io/handoff-from' in oldObject.metadata.?annotations.orValue({}))
  variables:
  - name: range
    expression: "'10.244.128.0/17'"
  - name: annotations
    expression: "object.metadata.?annotations.orValue({})"
  - name: source
    expression: "variables.annotations[?'ipam.cilium.io/handoff-from'].orValue('')"
  - name: pool
    expression: "variables.annotations[?'ipam.cilium.io/ip-pool'].orValue('')"
  - name: address
    expression: "variables.pool.startsWith('qrab-nic-') ? variables.pool.substring(9).replace('-', '.') : ''"
  validations:
  - expression: >-
      request.operation == 'CREATE' ||
      variables.annotations[?'ipam.cilium.io/handoff-from'] ==
        oldObject.metadata.?annotations.orValue({})[?'ipam.cilium.io/handoff-from']
    message: ipam.cilium.io/handoff-from is set only when a pod is created and never added, changed or removed
  - expression: >-
      request.operation == 'UPDATE' ||
      request.userInfo.username == 'system:serviceaccount:qrab:qrab-operator'
    message: only the qrab operator may create a pod with ipam.cilium.io/handoff-from
  - expression: >-
      request.operation == 'UPDATE' ||
      (request.namespace == 'qrab' &&
       object.metadata.?labels['app.kubernetes.io/name'].orValue('') == 'qrab' &&
       object.metadata.?labels['app.kubernetes.io/component'].orValue('') == 'vm-nic' &&
       variables.source.matches('^qrab/[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$'))
    message: a handoff target is a qrab vm-nic pod in namespace qrab taking over a pod in qrab
  - expression: >-
      request.operation == 'UPDATE' ||
      (isIP(variables.address) && ip(variables.address).family() == 4 &&
       cidr(variables.range).containsIP(variables.address) &&
       !('ipam.cilium.io/ipv4-pool' in variables.annotations) &&
       !('ipam.cilium.io/ipv6-pool' in variables.annotations))
    messageExpression: "'a handoff target takes its address from its own qrab-nic-<address> pool inside ' + variables.range + ', with no other pool annotation'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: qrab-nic-handoff
spec:
  policyName: qrab-nic-handoff
  validationActions: [Deny]
