apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qrab-operator
rules:
- apiGroups: [qrab.yapplesauce.com]
  resources: [virtualmachines]
  verbs: [get, list, watch, patch]
- apiGroups: [qrab.yapplesauce.com]
  resources: [virtualmachines/status]
  verbs: [get, patch, update]
- apiGroups: [qrab.yapplesauce.com]
  resources: [virtualmachinemigrations]
  verbs: [get, list, watch]
- apiGroups: [qrab.yapplesauce.com]
  resources: [virtualmachinemigrations/status]
  verbs: [get, patch]
- apiGroups: ['']
  resources: [pods, configmaps]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: ['']
  resources: [pods/resize]
  verbs: [patch]
# State PVCs of live-migration targets (<vm>-state-<id>, VM-owned); the
# operator deletes only those it labelled vm-state for the same VM UID.
# patch: it makes a dashboard-created state PVC owned by its VM
# (resources::state_claim_adoption), so the claim goes with the VM.
- apiGroups: ['']
  resources: [persistentvolumeclaims]
  verbs: [get, create, patch, delete]
# Operator-generated CHAP Secrets for spec.disks (<vm>-disk-<id>, VM-owned).
# Write-only: no get/list/watch, so the operator cannot read hand-declared
# credentials. secret-policy.yaml confines these writes to its own objects.
- apiGroups: ['']
  resources: [secrets]
  verbs: [create, patch, delete]
# The VM's Redfish and migration policies, and deleting the relay policies
# (<vm>-nic-<name>-relay, VM-owned) of the removed stream NIC datapath.
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: ['']
  resources: [serviceaccounts]
  resourceNames: [qrab-manager]
  verbs: [use]
# The Warning event of a VM released without evicting its guest SPIRE agent.
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qrab-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qrab-operator
subjects:
- kind: ServiceAccount
  name: qrab-operator
  namespace: qrab
