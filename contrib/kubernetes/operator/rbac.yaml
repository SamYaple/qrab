apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qrab-operator
rules:
- apiGroups: [qrab.yapplesauce.com]
  resources: [virtualmachines]
  verbs: [get, list, watch, patch]
- apiGroups: [qrab.yapplesauce.com]
  resources: [virtualmachines/status]
  verbs: [get, patch, update]
- apiGroups: ['']
  resources: [pods, configmaps]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: ['']
  resources: [persistentvolumeclaims]
  verbs: [get]
# Operator-generated CHAP Secrets for spec.disks (<vm>-disk-<id>, VM-owned).
# No list/watch/delete: owner GC removes them with the VM.
- apiGroups: ['']
  resources: [secrets]
  verbs: [get, create, patch]
- apiGroups: ['']
  resources: [serviceaccounts]
  resourceNames: [qrab-manager]
  verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qrab-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qrab-operator
subjects:
- kind: ServiceAccount
  name: qrab-operator
  namespace: qrab
