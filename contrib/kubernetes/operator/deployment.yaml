# With the storage service enabled, apply this only through
# `kubectl apply -k contrib/kubernetes/operator-storage-api`; on its own it
# drops the storage client and blocks every VM with spec.disks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrab-operator
  labels:
    app.kubernetes.io/name: qrab-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qrab-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qrab-operator
    spec:
      serviceAccountName: qrab-operator
      # Only the operator talks to Kubernetes. VM pods explicitly disable this.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: operator
        # Updated from published immutable references by the release pin commit.
        image: zot.yapplesauce.com/qrab/operator@sha256:ddefafb3a2199bdc5e5aa2e91492f70a6c9bf79e1ce24cc94e8cba86872ea5d1
        imagePullPolicy: Always
        args: [run]
        env:
        - name: QRAB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - {name: QRAB_VM_IMAGE, value: 'zot.yapplesauce.com/qrab/manager@sha256:fcac320b35347d73d3902c1a1b27adf31859e2df5a10224f2b835127f2e3b558'}
        - {name: QRAB_OIDC_ISSUER, value: 'https://idm.yaple.net/oauth2/openid/qrab-bmc'}
        - {name: QRAB_OIDC_CLIENT_ID, value: qrab-bmc}
        # Every BMC also accepts the dashboard's forwarded ID tokens.
        - {name: QRAB_BMC_BEARER_ISSUER, value: 'https://idm.yaple.net/oauth2/openid/qrab-dashboard'}
        - {name: QRAB_BMC_BEARER_AUDIENCE, value: qrab-dashboard}
        - {name: QRAB_IDP_IP, value: '192.168.0.251'}
        # Stable guest NIC addresses (docs/networking.md#stable-addresses). Keep
        # equal to the range in nic-addresses.yaml and kubernetes-gitops'
        # infrastructure/config/cilium-pod-ip-pools.yaml.
        - {name: QRAB_NIC_ADDRESS_RANGE, value: 10.244.128.0/17}
        ports:
        - name: health
          containerPort: 8081
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: '1', memory: 192Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        startupProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 10
