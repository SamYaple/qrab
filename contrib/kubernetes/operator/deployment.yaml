apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrab-operator
  labels:
    app.kubernetes.io/name: qrab-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qrab-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qrab-operator
    spec:
      serviceAccountName: qrab-operator
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: operator
        image: zot.yapplesauce.com/qrab/operator@sha256:e8c7bd9815efccd8a0abddc62c3ec3ae23e583f1c6620361a071bffbd16e6bb1
        imagePullPolicy: Always
        args:
        - run
        env:
        - name: QRAB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: QRAB_VM_IMAGE
          value: zot.yapplesauce.com/qrab/manager@sha256:4a147cba51ccfec915f5bece0ffba3016f434e1e0f630bfbf940dd7bcd7252ef
        - name: QRAB_OIDC_ISSUER
          value: https://idm.yaple.net/oauth2/openid/qrab-bmc
        - name: QRAB_OIDC_CLIENT_ID
          value: qrab-bmc
        - name: QRAB_BMC_BEARER_ISSUER
          value: https://idm.yaple.net/oauth2/openid/qrab-dashboard
        - name: QRAB_BMC_BEARER_AUDIENCE
          value: qrab-dashboard
        - name: QRAB_IDP_IP
          value: 192.168.0.251
        - name: QRAB_NIC_ADDRESS_RANGE
          value: 10.244.128.0/17
        ports:
        - name: health
          containerPort: 8081
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          periodSeconds: 2
          failureThreshold: 30
          exec:
            command:
            - /usr/local/bin/qrab-operator
            - probe-health
          timeoutSeconds: 3
        readinessProbe:
          periodSeconds: 5
          exec:
            command:
            - /usr/local/bin/qrab-operator
            - probe-health
          timeoutSeconds: 3
        livenessProbe:
          periodSeconds: 10
          exec:
            command:
            - /usr/local/bin/qrab-operator
            - probe-health
          timeoutSeconds: 3
