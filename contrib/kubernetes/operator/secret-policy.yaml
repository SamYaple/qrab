# The operator's RBAC is write-only for Secrets (no get/list/watch). This
# policy confines those writes to the VM-owned CHAP Secrets it renders, so it
# can neither overwrite nor delete a hand-declared credential such as
# qrab-demo-iscsi. Checked live by contrib/kubernetes/operator/check-secret-policy.sh.
# Removed-disk cleanup first sends JSON Patch tests for its expected VM/disk
# owner, requesting PartialObjectMetadata only, then deletes with the checked
# Secret UID/resourceVersion. Generic operator admission alone does not bind a
# name-based DELETE to the VM being reconciled.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: qrab-operator-disk-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE, DELETE]
      resources: [secrets]
  matchConditions:
  - name: qrab-operator
    expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':qrab-operator'"
  variables:
  - name: subject
    expression: "request.operation == 'DELETE' ? oldObject : object"
  - name: owners
    expression: "has(variables.subject.metadata.ownerReferences) ? variables.subject.metadata.ownerReferences : []"
  - name: labels
    expression: "has(variables.subject.metadata.labels) ? variables.subject.metadata.labels : {}"
  - name: annotations
    expression: "has(variables.subject.metadata.annotations) ? variables.subject.metadata.annotations : {}"
  validations:
  - expression: >-
      variables.owners.size() == 1 &&
      variables.owners[0].apiVersion == 'qrab.yapplesauce.com/v1alpha1' &&
      variables.owners[0].kind == 'VirtualMachine' &&
      has(variables.owners[0].controller) && variables.owners[0].controller == true
    message: the qrab operator may only write Secrets controller-owned by a VirtualMachine
  - expression: >-
      'app.kubernetes.io/component' in variables.labels &&
      variables.labels['app.kubernetes.io/component'] == 'disk-credential' &&
      'qrab.yapplesauce.com/owner-uid' in variables.labels &&
      variables.owners.size() == 1 &&
      variables.labels['qrab.yapplesauce.com/owner-uid'] == variables.owners[0].uid
    message: the qrab operator may only write its labelled disk-credential Secrets
  - expression: >-
      'qrab.yapplesauce.com/disk' in variables.annotations &&
      variables.owners.size() == 1 &&
      variables.subject.metadata.name == variables.owners[0].name + '-disk-' + variables.annotations['qrab.yapplesauce.com/disk']
    message: disk-credential Secrets are named <vm>-disk-<disk id>
  - expression: >-
      request.operation == 'DELETE' ||
      (has(object.type) && object.type == 'Opaque' && has(object.data) &&
       object.data.size() == 1 && 'password' in object.data)
    message: disk-credential Secrets hold only an Opaque password key
  - expression: >-
      request.operation != 'UPDATE' ||
      (has(oldObject.metadata.ownerReferences) && oldObject.metadata.ownerReferences.size() == 1 &&
       variables.owners.size() == 1 &&
       oldObject.metadata.ownerReferences[0].uid == variables.owners[0].uid &&
       has(oldObject.metadata.labels) && 'app.kubernetes.io/component' in oldObject.metadata.labels &&
       oldObject.metadata.labels['app.kubernetes.io/component'] == 'disk-credential')
    message: the qrab operator may only update a disk-credential Secret it already owns for the same VM
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: qrab-operator-disk-secrets
spec:
  policyName: qrab-operator-disk-secrets
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: qrab
